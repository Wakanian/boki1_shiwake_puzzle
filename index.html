<title>簿記1級仕分けパズル</title>
<style>
:root{
  /* 基調色：千草色 #97C5B0 */
  --base:#97C5B0; --base-ink:#15372b; --base-deep:#7fb39c;
  --bg:#f3f8f5; --card:#ffffff; --line:#dbe8e1; --ink:#1d2b26; --sub:#475a52; --muted:#86998f;
  --pri:#3b7560; --pri-ink:#15372b; --pri-soft:#e6f2ec; --pri-line:#b9d9ca;
  --ok:#1f8a5c; --ok-soft:#e3f5ec; --ng:#c0463a; --ng-soft:#fbecea;
  --warn:#b45309; --warn-soft:#fff6e6;
  --shadow:0 1px 2px rgba(15,23,42,.05);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --base:#97C5B0; --base-ink:#10271f; --base-deep:#86b8a1;
    --bg:#0e1512; --card:#16201c; --line:#26352f; --ink:#e4efe9; --sub:#b3c4bb; --muted:#7c8f86;
    --pri:#97C5B0; --pri-ink:#10271f; --pri-soft:#1a2b24; --pri-line:#35584a;
    --ok:#5fd39c; --ok-soft:#10261b; --ng:#f08577; --ng-soft:#2b1715;
    --warn:#fbbf24; --warn-soft:#2a2112;
    --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  -webkit-text-size-adjust:100%;}
body{overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:disabled{cursor:default}

/* ===== 共通ヘッダー ===== */
.topbar{position:sticky;top:0;z-index:10;background:var(--base);color:var(--base-ink);
  padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;}
.topbar h1{margin:0;font-size:19px;letter-spacing:.04em;font-weight:800}
.topbar p{margin:4px 0 0;font-size:12px;opacity:.8;font-weight:600}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px calc(env(safe-area-inset-bottom) + 28px)}


/* ===== トップ（ヒーロー） ===== */
.hero{text-align:center;padding:calc(env(safe-area-inset-top) + 28px) 0 22px}
.brand{display:inline-flex;align-items:center;gap:10px;color:var(--pri);font-weight:800;font-size:14px;letter-spacing:.28em}
.brand-mark{width:30px;height:30px;border-radius:8px;box-shadow:none}
.hero h1{margin:12px 0 0;font-size:26px;font-weight:900;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.ver{font-size:12px;font-weight:800;background:var(--base);color:var(--base-ink);padding:3px 10px;border-radius:999px;letter-spacing:0}
.hero p{margin:8px 0 0;color:var(--muted);font-size:14px;font-weight:600;letter-spacing:.04em}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:16px}
.seg button{min-height:46px;border-radius:11px;font-weight:800;font-size:14.5px;color:var(--muted);transition:background .15s,color .15s}
.seg button.on{background:var(--card);color:var(--pri);box-shadow:0 1px 3px rgba(20,50,40,.12)}
.banner{width:100%;display:flex;align-items:center;gap:14px;text-align:left;padding:18px 16px 18px 18px;border-radius:18px;
  background:linear-gradient(135deg,#2f6652,#3f8068 60%,#5a9a82);color:#fff;box-shadow:0 6px 18px rgba(47,102,82,.25);transition:transform .08s}
.banner:active:not(:disabled){transform:scale(.98)}
.banner.ng{background:linear-gradient(135deg,#9c3a30,#c0463a);box-shadow:0 6px 18px rgba(192,70,58,.22)}
.banner:disabled{opacity:.45;box-shadow:none}
.banner-ic{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.banner-tx{flex:1;min-width:0}
.banner-tx b{display:block;font-size:19px;font-weight:900;letter-spacing:.02em}
.banner-tx small{display:block;font-size:12.5px;opacity:.85;margin-top:4px}
.banner-go{opacity:.9;flex:none}
.divider{display:flex;align-items:center;gap:12px;margin:26px 0 16px;color:var(--muted);font-size:13px;font-weight:600}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.cat.rv .cat-ic{background:var(--ng-soft);color:var(--ng)}
.cat.live.rv .cat-badge{color:var(--ng);background:var(--ng-soft);padding:2px 8px;border-radius:999px;font-weight:800}
.empty-note{text-align:center;color:var(--muted);font-size:13px;line-height:1.8;padding:18px 8px 8px}

/* ===== 復習エリア ===== */
.review{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:22px;position:relative;overflow:hidden}
.review.has{border-color:#eec3bd;background:linear-gradient(180deg,var(--ng-soft),var(--card) 70%)}
.review-top{display:flex;align-items:center;gap:10px}
.review-ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--ng-soft);color:var(--ng);flex:none}
.review h2{margin:0;font-size:15px;font-weight:800}
.review small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.review-count{margin-left:auto;font-size:26px;font-weight:800;color:var(--ng);line-height:1}
.review-count span{font-size:12px;font-weight:700;margin-left:2px}
.review-list{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.review-list li{font-size:11.5px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--sub)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:12px;font-weight:800;font-size:15.5px;transition:transform .08s, opacity .15s}
.btn:active:not(:disabled){transform:scale(.98)}
.btn-pri{background:var(--base);color:var(--base-ink);box-shadow:inset 0 -2px 0 var(--base-deep)}
.btn-ng{background:var(--ng);color:#fff}
.btn-ghost{background:var(--card);border:1.5px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.35}
.review .btn{margin-top:14px}

/* ===== カテゴリ ===== */
.sec-title{font-size:12.5px;color:var(--muted);font-weight:700;margin:6px 2px 10px;letter-spacing:.03em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.cat{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 12px 14px;text-align:left;min-height:88px;
  display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);transition:transform .08s,border-color .15s}
.cat:active{transform:scale(.97);border-color:var(--pri-line)}
.cat-top{display:flex;justify-content:space-between;align-items:flex-start}
.cat-ic{width:30px;height:30px;border-radius:50%;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center}
.cat-badge{font-size:11px;color:var(--muted);font-weight:600}
.cat.live .cat-badge{color:var(--pri);background:var(--pri-soft);padding:2px 8px;border-radius:999px;font-weight:800}
.cat-name{font-size:14px;font-weight:800;line-height:1.35}
.cat.empty .cat-name{color:var(--sub)}
.cat-done{font-size:10.5px;color:var(--ok);font-weight:800;margin-left:6px}

/* ===== クイズ画面 ===== */
.screen{height:100vh;height:100dvh;display:flex;flex-direction:column}
.qbar{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 8px 8px;background:var(--card);border-bottom:1px solid var(--line);flex:none}
.back{display:flex;align-items:center;gap:4px;min-height:44px;min-width:44px;padding:0 12px 0 6px;border-radius:10px;font-weight:700;font-size:14px;color:var(--pri)}
.back:active{background:var(--pri-soft)}
.qbar-title{flex:1;min-width:0;font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qbar-prog{font-size:12px;color:var(--muted);font-weight:700;padding-right:8px}
.progress{height:3px;background:var(--line);flex:none}
.progress i{display:block;height:100%;background:var(--base);transition:width .3s}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.qwrap{max-width:560px;margin:0 auto;padding:14px 14px 20px}
.tag{display:inline-block;font-size:11px;font-weight:800;color:var(--pri);background:var(--pri-soft);padding:3px 9px;border-radius:999px;margin-bottom:8px}
.tag.rv{color:var(--ng);background:var(--ng-soft)}
.qtitle{font-size:16px;font-weight:800;margin:0 0 10px}
.stem{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-size:14px;line-height:1.75;color:var(--ink)}
.stem b{color:var(--pri)}
.stem .data{margin:8px 0 0;padding:8px 10px;background:var(--bg);border-radius:8px;font-size:13px;line-height:1.7}
.hint-btn{margin-top:8px;font-size:12.5px;font-weight:700;color:var(--warn);padding:8px 4px;min-height:40px}
.hint{background:var(--warn-soft);color:var(--warn);font-size:13px;border-radius:10px;padding:10px 12px;line-height:1.6;font-weight:600}

/* 仕訳 */
.jr{margin-top:14px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.jr-head{display:grid;grid-template-columns:1fr 1fr;font-size:12px;font-weight:800;color:var(--muted);background:var(--bg);border-bottom:1px solid var(--line)}
.jr-head span{padding:7px 10px}
.jr-head span+span{border-left:1px solid var(--line)}
.jr-row{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px dashed var(--line)}
.jr-row:last-child{border-bottom:none}
.jr-cell{padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.jr-cell+.jr-cell{border-left:1px solid var(--line)}
.fx{font-size:13.5px;font-weight:700;padding:8px 4px;line-height:1.35;word-break:break-all}
.fx.amt{text-align:right;font-variant-numeric:tabular-nums}
.slot{min-height:44px;border-radius:9px;border:2px dashed var(--pri-line);background:var(--pri-soft);color:var(--pri);
  font-size:13.5px;font-weight:800;padding:6px 8px;text-align:left;line-height:1.3;word-break:break-all;transition:all .12s;position:relative}
.slot.amt{text-align:right;font-variant-numeric:tabular-nums}
.slot.empty{color:var(--pri);opacity:.9}
.slot.empty::before{content:"［ ? ］";font-weight:800;letter-spacing:.05em}
.slot.amt.empty::before{content:"［ ? ］"}
.slot.active{border-style:solid;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-line);animation:pulse 1.4s infinite}
.slot.filled{border-style:solid;background:var(--card);color:var(--ink);border-color:var(--pri-line)}
.slot.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft);color:var(--ok);animation:none;box-shadow:none}
.slot.ng{border-style:solid;border-color:var(--ng);background:var(--ng-soft);color:var(--ng);animation:none;box-shadow:none;text-decoration:line-through}
.fix{display:block;font-size:12px;font-weight:800;color:var(--ok);margin-top:2px;padding:0 2px}
.fix::before{content:"→ ";}
.jr-cell .fixwrap{display:flex;flex-direction:column}
.jr-cell .fixwrap.amt .fix{text-align:right}
/* 構造フォーム（計算表・判定） */
.fm-head{font-size:12px;font-weight:800;color:var(--muted);background:var(--bg);border-bottom:1px solid var(--line);padding:7px 10px}
.fm-row{display:grid;grid-template-columns:1fr 42%;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px dashed var(--line)}
.fm-row:last-child{border-bottom:none}
.fm-row.sum{background:var(--pri-soft);border-top:1.5px solid var(--pri-line)}
.fm-l .fx{text-align:left;font-weight:700;font-size:13px}
.fm-v .fx{text-align:right}
.fm-v .slot,.fm-v .fixwrap{width:100%}
.fm-v .fixwrap .fix{text-align:right}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px var(--pri-line)}50%{box-shadow:0 0 0 6px transparent}}

/* 結果・解説 */
.verdict{margin-top:14px;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.ng{background:var(--ng-soft);color:var(--ng)}
.verdict small{display:block;font-weight:600;font-size:12px;opacity:.9;margin-top:2px}
.explain{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.explain h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:6px}
.explain h3::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--pri)}
.explain ul{margin:0;padding-left:1.1em;font-size:13.5px;line-height:1.8}
.explain li{margin-bottom:4px}
.explain b{color:var(--pri)}
.explain .calc{font-variant-numeric:tabular-nums;background:var(--bg);border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.8;margin:8px 0}
.point{margin-top:10px;background:var(--pri-soft);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.7}
.point strong{color:var(--pri)}

/* 下部パーツ */
.dock{flex:none;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);box-shadow:0 -4px 16px rgba(15,23,42,.06)}
.dock-inner{max-width:560px;margin:0 auto}
.dock-label{font-size:11px;color:var(--muted);font-weight:700;margin:0 2px 7px;display:flex;justify-content:space-between}
.parts{max-height:36vh;overflow-y:auto;padding:2px}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.pgrid.n{grid-template-columns:repeat(3,1fr);margin-top:7px}
.part{min-height:48px;border-radius:11px;border:1.5px solid var(--line);background:var(--bg);font-size:13.5px;font-weight:800;padding:6px 8px;line-height:1.3;transition:transform .07s,opacity .15s}
.part.num{font-variant-numeric:tabular-nums;font-size:15px}
.part:active:not(:disabled){transform:scale(.95);background:var(--pri-soft);border-color:var(--pri)}
.part.used{opacity:.22}
.actions{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:10px}

/* モーダル・演出 */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;z-index:50;padding:24px;animation:fade .15s}
.modal{background:var(--card);border-radius:18px;padding:22px 20px 18px;width:100%;max-width:340px;text-align:center}
.modal h3{margin:6px 0 6px;font-size:17px}
.modal p{margin:0 0 16px;color:var(--sub);font-size:13.5px;line-height:1.7}
.modal .ic{width:48px;height:48px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:var(--pri-soft);color:var(--pri)}
.stamp{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:60}
.stamp div{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;font-size:84px;font-weight:900;
  animation:stamp .9s ease forwards;background:var(--card);box-shadow:0 10px 40px rgba(0,0,0,.18)}
.stamp.ok div{color:var(--ok);border:6px solid var(--ok)}
.stamp.ng div{color:var(--ng);border:6px solid var(--ng)}
@keyframes stamp{0%{transform:scale(1.8);opacity:0}25%{transform:scale(1);opacity:1}75%{transform:scale(1);opacity:1}100%{transform:scale(.9);opacity:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* 終了画面 */
.done{text-align:center;padding:40px 8px}
.done .big{font-size:48px;font-weight:900;color:var(--pri);margin:8px 0}
.done p{color:var(--sub);font-size:14px}
.done .btn{margin-top:10px}
.foot{font-size:11px;color:var(--muted);text-align:center;margin-top:8px;line-height:1.6}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   簿記1級仕分けパズル
   - 単一HTML / 外部リソースなし（オフライン動作）
   - 問題の追加は QUESTIONS 配列に追記するだけ
   ========================================================= */

/* ---------- カテゴリ定義 ---------- */
const SECTIONS = [
  { label: '商業簿記・会計学', cats: [
    '連結会計','資産除去債務','有価証券','減損会計','リース会計','退職給付会計','税効果会計',
    '外貨換算会計','社債','純資産','収益認識','本支店会計','返品権付き販売',
    'カスタマーロイヤルティプログラム','有価証券の保有目的の変更','その他の包括利益',
    '事業分離と連結会計','通貨オプション','売価還元法','分配可能額の計算','金銭債権譲渡'
  ]},
  { label: '工業簿記・原価計算', cats: [
    '標準原価計算','個別原価計算','直接原価計算','意思決定会計','予算編成','実際工程別総合原価計算',
    '配合差異と歩留差異','最適セールスミックス','連産品の計算','原価差異の会計処理',
    '原価企画','設備投資意思決定','品質原価','CVP分析'
  ]}
];

/* ---------- 問題データ ----------
   dr / cr : 借方・貸方の行（同じ index が同じ行に並ぶ）
   acc / amt : 文字列なら固定表示、{b:'正解'} なら穴埋め[ ? ]
   distractors : ひっかけパーツ
-------------------------------------------------- */
const QUESTIONS = [
  {
    id: 'aro-01',
    cat: '資産除去債務',
    title: '決算時：減価償却と利息費用の計上',
    stem: `X1年4月1日に設備（取得原価 <b>50,000</b>千円、耐用年数<b>5年</b>、残存価額ゼロ、定額法）を取得し使用開始した。
      使用後の除去義務があり、取得時に資産除去債務 <b>10,000</b>千円（割引率<b>3%</b>で割引済み）を計上している。`,
    data: '決算日：X2年3月31日（単位：千円）<br>X2年3月31日の決算整理仕訳を完成させよ。',
    dr: [
      { acc: '減価償却費',       amt: { b: '12,000' } },
      { acc: { b: '利息費用' },   amt: { b: '300' } }
    ],
    cr: [
      { acc: '減価償却累計額',   amt: { b: '12,000' } },
      { acc: { b: '資産除去債務' }, amt: { b: '300' } }
    ],
    distractors: ['10,000', '1,500', '支払利息', '未払費用'],
    hint: '除去費用は資産の帳簿価額に「加算」済み。時の経過による債務の増加は、どの勘定を増やす？',
    explain: `
      <ul>
        <li>資産除去債務の計上額 10,000 は<b>設備の帳簿価額に加算</b>されている。減価償却の基礎は 50,000＋10,000＝60,000。</li>
        <li>利息費用は<b>期首の資産除去債務 × 割引率</b>。時の経過で債務が増えるので、貸方は<b>資産除去債務</b>（負債の増加）。</li>
      </ul>
      <div class="calc">減価償却費：(50,000＋10,000) ÷ 5年 ＝ <b>12,000</b><br>利息費用　：10,000 × 3% ＝ <b>300</b></div>
      <ul>
        <li>「支払利息」「未払費用」はひっかけ。現金の支払いも経過利息の未払いもない。</li>
        <li>「1,500」は 50,000×3%。利息費用の基礎は取得原価ではなく<b>資産除去債務</b>。</li>
      </ul>
      <div class="point"><strong>1級ポイント：</strong>利息費用はP/L上、関連する有形固定資産の<b>減価償却費と同じ区分</b>（通常は販管費）に計上する。営業外費用ではない。</div>`
  },
  {
    id: 'cons-01',
    cat: '連結会計',
    title: '連結2年目の開始仕訳',
    stem: `P社はX1年3月31日にS社の発行済株式の<b>80%</b>を <b>20,000</b>千円で取得し、支配を獲得した。
      同日のS社純資産は資本金 <b>15,000</b>、利益剰余金 <b>5,000</b>。
      X1年度のS社当期純利益は <b>2,000</b>（配当なし）。のれんは<b>10年</b>で定額償却する。`,
    data: '単位：千円／資産・負債の時価評価差額なし<br>X2年度（連結2年目）の開始仕訳を完成させよ。',
    dr: [
      { acc: '資本金当期首残高',       amt: '15,000' },
      { acc: '利益剰余金当期首残高',   amt: { b: '5,800' } },
      { acc: { b: 'のれん' },          amt: { b: '3,600' } }
    ],
    cr: [
      { acc: 'S社株式',                         amt: '20,000' },
      { acc: { b: '非支配株主持分当期首残高' }, amt: { b: '4,400' } }
    ],
    distractors: ['5,000', '5,400', '4,000', 'のれん償却額', '非支配株主に帰属する当期純利益'],
    hint: '前期の損益項目（のれん償却額・非支配株主に帰属する当期純利益）は、開始仕訳では「利益剰余金当期首残高」に化ける。',
    explain: `
      <ul>
        <li>前期の連結修正は個別F/Sに残らないため、当期首に<b>まとめて再現</b>するのが開始仕訳。</li>
        <li>純資産項目は「<b>〜当期首残高</b>」、前期の損益項目はすべて<b>利益剰余金当期首残高</b>に置き換える。</li>
      </ul>
      <div class="calc">
        取得時：のれん＝20,000－(20,000×80%)＝4,000／非支配＝20,000×20%＝4,000<br>
        前期：のれん償却 4,000÷10年＝400／非支配への按分 2,000×20%＝400<br>
        利益剰余金当期首残高＝5,000＋400＋400＝<b>5,800</b><br>
        のれん＝4,000－400＝<b>3,600</b><br>
        非支配株主持分当期首残高＝4,000＋400＝<b>4,400</b><br>
        検算：借 15,000＋5,800＋3,600＝24,400 ＝ 貸 20,000＋4,400</div>
      <div class="point"><strong>1級ポイント：</strong>「のれん償却額」「非支配株主に帰属する当期純利益」は当期の損益勘定なので開始仕訳には出てこない。「5,400」は片方の修正を落とした典型ミス。</div>`
  },
  {
    id: 'std-01',
    cat: '標準原価計算',
    title: '直接材料費の差異分析と借貸判定',
    stem: `当月の製品生産量は <b>500個</b>（月初・月末仕掛品なし）。
      直接材料の原価標準は <b>@100円 × 2kg/個</b>。
      当月の実際消費量は <b>1,050kg</b>、実際単価は <b>@98円</b>（実際消費額 102,900円）。`,
    data: 'シングル・プラン採用。価格差異・数量差異は材料消費時に把握する。<br>材料消費時の仕訳を完成させよ。',
    dr: [
      { acc: { b: '仕掛品' },       amt: { b: '100,000' } },
      { acc: { b: '材料数量差異' }, amt: { b: '5,000' } }
    ],
    cr: [
      { acc: '材料',                amt: '102,900' },
      { acc: { b: '材料価格差異' }, amt: { b: '2,100' } }
    ],
    distractors: ['製品', '105,000', '2,000', '4,900'],
    hint: '不利差異は借方、有利差異は貸方。価格差異は「実際数量」、数量差異は「標準単価」で掛ける。',
    explain: `
      <ul>
        <li>シングル・プランでは仕掛品を<b>標準原価</b>で借記する：500個×2kg×@100＝100,000。</li>
        <li>差異は「費用のかたまり」とイメージ。<b>不利差異＝借方</b>、<b>有利差異＝貸方</b>。</li>
      </ul>
      <div class="calc">
        価格差異＝(@100－@98)×実際1,050kg＝＋2,100（有利）→ <b>貸方</b><br>
        数量差異＝(標準1,000kg－実際1,050kg)×@100＝－5,000（不利）→ <b>借方</b><br>
        検算：借 100,000＋5,000＝105,000 ＝ 貸 102,900＋2,100</div>
      <ul>
        <li>「2,000」は単価差×<b>標準</b>数量のミス。価格差異は必ず<b>実際数量</b>で計算（ボックス図の外側）。</li>
        <li>「105,000」は標準単価×実際数量。これは仕掛品ではなく、価格差異を除いた後の中間値。</li>
      </ul>
      <div class="point"><strong>1級ポイント：</strong>パーシャル・プランなら仕掛品は実際消費量ベースで借記され、差異は仕掛品勘定の中で算出される。プランによって「どこで差異が出るか」を問うのが本試験の定番。</div>`
  }
];

/* ---------- 商業簿記・会計学 追加問題（各論点5問） ---------- */
const B = b => ({ b });
const L = (acc, amt) => ({ acc, amt });
const EX = (items, calc, point) =>
  `<ul>${items.map(i => `<li>${i}</li>`).join('')}</ul>` +
  (calc ? `<div class="calc">${calc}</div>` : '') +
  (point ? `<div class="point"><strong>1級ポイント：</strong>${point}</div>` : '');

const MORE_QUESTIONS = [
/* ===== 連結会計 ===== */
{ id:'cons-02', cat:'連結会計', title:'当期の連結修正：のれん償却と利益の按分',
  stem:`P社はS社株式の<b>80%</b>を保有（前期末に取得）。支配獲得時ののれんは <b>4,000</b>千円で、<b>10年</b>で定額償却する。当期のS社当期純利益は <b>3,000</b>千円。`,
  data:'単位：千円<br>当期の連結修正仕訳（のれん償却・非支配株主への利益按分）を完成させよ。',
  dr:[L('のれん償却額',B('400')), L(B('非支配株主に帰属する当期純利益'),B('600'))],
  cr:[L(B('のれん'),B('400')), L(B('非支配株主持分当期変動額'),'600')],
  distractors:['2,400','非支配株主持分当期首残高','300'],
  hint:'子会社の利益のうち非支配株主の取り分（20%）を、連結P/Lから非支配株主へ振り替える。',
  explain:EX(['のれんは毎期償却し、「のれん償却額」（販管費）を計上する。','S社の利益は100%連結P/Lに入っているため、非支配株主の持分20%を「非支配株主に帰属する当期純利益」として振り替える。相手は純資産の<b>非支配株主持分当期変動額</b>。'],
   'のれん償却：4,000÷10年＝<b>400</b><br>非支配への按分：3,000×20%＝<b>600</b>',
   '当期の修正では「当期変動額」、開始仕訳では「当期首残高」。同じ非支配株主持分でも使う勘定が変わる。') },

{ id:'cons-03', cat:'連結会計', title:'子会社の配当金の修正',
  stem:`P社はS社株式の<b>80%</b>を保有している。当期にS社は <b>1,000</b>千円の剰余金の配当を行い、P社はその受取額を受取配当金として計上した。`,
  data:'単位：千円<br>連結上の配当金の修正仕訳を完成させよ。',
  dr:[L(B('受取配当金'),B('800')), L(B('非支配株主持分当期変動額'),B('200'))],
  cr:[L(B('剰余金の配当'),'1,000')],
  distractors:['利益剰余金当期首残高','非支配株主に帰属する当期純利益','1,000'],
  hint:'親会社分はグループ内の資金移動（受取配当金と相殺）、非支配株主分は持分の減少。',
  explain:EX(['S社の配当1,000は連結上の「剰余金の配当」から全額取り消す。','80%（P社受取分）は内部取引なので<b>受取配当金</b>と相殺。','20%（非支配株主分）は<b>非支配株主持分の減少</b>として処理する。'],
   '受取配当金：1,000×80%＝<b>800</b><br>非支配株主持分：1,000×20%＝<b>200</b>',
   '非支配株主への配当は「非支配株主に帰属する当期純利益」ではなく、持分そのものを減らす。') },

{ id:'cons-04', cat:'連結会計', title:'未実現利益の消去（ダウンストリーム）',
  stem:`P社は子会社S社（持分<b>80%</b>）に商品を販売している（売上総利益率<b>20%</b>）。S社の期末商品のうちP社から仕入れた分は <b>5,000</b>千円である。`,
  data:'単位：千円<br>期末商品に含まれる未実現利益を消去する仕訳を完成させよ。',
  dr:[L(B('売上原価'),B('1,000'))],
  cr:[L(B('商品'),B('1,000'))],
  distractors:['非支配株主持分当期変動額','800','1,250'],
  hint:'親会社→子会社への販売。利益を上げたのは誰か？',
  explain:EX(['未実現利益は売上原価を増やす（＝利益を減らす）と同時に、商品を減額する。','ダウンストリーム（親→子）は利益を計上したのが親会社なので、<b>全額消去・全額親会社負担</b>。非支配株主への按分はない。'],
   '未実現利益：5,000×20%＝<b>1,000</b>',
   '「1,250」は売上総利益率20%を原価加算率と取り違えたミス（5,000×25%）。') },

{ id:'fx-01', cat:'外貨換算会計', title:'外貨建買掛金の決算時換算',
  stem:`商品を <b>1,000ドル</b>で掛けで輸入した（取引時 <b>@140円</b>）。決算日の為替相場は <b>@145円</b>。買掛金は未決済。`,
  data:'単位：円<br>決算時の換算替えの仕訳を完成させよ。',
  dr:[L(B('為替差損益'),B('5,000'))],
  cr:[L(B('買掛金'),B('5,000'))],
  distractors:['商品','145,000','140,000'],
  hint:'円安になった。支払うべき円は増える？減る？',
  explain:EX(['買掛金は<b>貨幣項目</b> → 決算日レート（CR）で換算替え。','商品（非貨幣項目）は取引時レートのまま換算替えしない。','円安で負債が増える → <b>為替差損</b>（借方）。'],
   '（145－140）×1,000ドル＝<b>5,000</b>',
   '「商品」を修正するのは典型的な誤り。棚卸資産は取得時のレートで確定している。') },

{ id:'fx-02', cat:'外貨換算会計', title:'為替予約：振当処理（取引後に予約）',
  stem:`<b>1,000ドル</b>の売掛金（取引時 <b>@140円</b>）について、後日為替予約を行った。予約時の直物相場 <b>@142円</b>、先物相場 <b>@144円</b>。`,
  data:'単位：円／振当処理<br>予約時の仕訳を完成させよ。',
  dr:[L('売掛金',B('4,000'))],
  cr:[L(B('為替差損益'),B('2,000')), L(B('前受収益'),B('2,000'))],
  distractors:['前払費用','6,000','1,000'],
  hint:'直々差額は当期の損益、直先差額は期間配分。',
  explain:EX(['売掛金を予約レート（@144）に付け替える。','<b>直々差額</b>（取引時の直物→予約時の直物）：当期の為替差損益。','<b>直先差額</b>（予約時の直物→先物）：予約日の属する期から決済日の属する期まで配分 → 収益なら<b>前受収益</b>。'],
   '売掛金：（144－140）×1,000＝<b>4,000</b><br>直々差額：（142－140）×1,000＝2,000<br>直先差額：（144－142）×1,000＝2,000',
   '資産側で先物＞直物ならプレミアム（収益）→前受収益。逆なら前払費用。') },

{ id:'fx-03', cat:'外貨換算会計', title:'外貨建満期保有債券の償却原価法',
  stem:`外貨建満期保有目的債券（額面 1,000ドル、取得価額 950ドル）について、当期の償却額は <b>10ドル</b>（定額法）。期中平均相場 <b>@150円</b>、決算日相場 <b>@155円</b>。`,
  data:'単位：円<br>償却原価法による当期の償却額の仕訳を完成させよ。',
  dr:[L(B('満期保有目的債券'),B('1,500'))],
  cr:[L(B('有価証券利息'),B('1,500'))],
  distractors:['1,550','1,450','為替差損益'],
  hint:'償却額は利息＝期間を通じて発生する。どのレート？',
  explain:EX(['外貨建の償却額は、利息と同じく<b>期中平均相場（AR）</b>で換算する。','その後、償却原価（外貨）全体を決算日レートで換算し、差額を為替差損益とする。'],
   '10ドル×@150＝<b>1,500</b>',
   '償却額を決算日レート（1,550）で換算するのは誤り。償却額はAR、B/S残高はCR。') },

{ id:'fx-04', cat:'外貨換算会計', title:'外貨建その他有価証券の期末評価',
  stem:`その他有価証券（外国株式）：取得原価 <b>100ドル</b>（取得時 <b>@140円</b>）、期末時価 <b>120ドル</b>、決算日相場 <b>@150円</b>。全部純資産直入法、税効果は考慮しない。`,
  data:'単位：円<br>期末評価の仕訳を完成させよ。',
  dr:[L('その他有価証券',B('4,000'))],
  cr:[L(B('その他有価証券評価差額金'),B('4,000'))],
  distractors:['為替差損益','3,000','投資有価証券評価益'],
  hint:'時価の変動分も為替の変動分も、まとめてどこへ？',
  explain:EX(['外貨建その他有価証券は、外貨時価×決算日レートで評価する。','差額は<b>為替変動分も含めて</b>全額その他有価証券評価差額金とする（原則）。'],
   '期末：120ドル×@150＝18,000<br>取得：100ドル×@140＝14,000<br>差額：<b>4,000</b>',
   '債券の場合は、外貨ベースの時価変動部分を評価差額、残りを為替差損益とする処理も認められる。株式は全額評価差額。') },

{ id:'fx-05', cat:'外貨換算会計', title:'為替予約の独立処理：期末評価',
  stem:`<b>1,000ドル</b>のドル売りの為替予約（先物相場 <b>@144円</b>）を行っている。決算日の先物相場は <b>@146円</b>。独立処理（ヘッジ会計なし）を採用している。`,
  data:'単位：円<br>決算時の為替予約の評価の仕訳を完成させよ。',
  dr:[L(B('為替差損益'),B('2,000'))],
  cr:[L(B('為替予約'),B('2,000'))],
  distractors:['前受収益','4,000','売掛金'],
  hint:'@144で売る約束。今なら@146で売れる。得した？損した？',
  explain:EX(['為替予約はデリバティブ → 期末に時価評価し、差額は当期の損益。','ドル売り予約で先物相場が上がった → 本来より安く売る約束 → <b>損失</b>。為替予約は負債となる。'],
   '（146－144）×1,000ドル＝<b>2,000</b>（評価損）',
   'ドル売り予約は円安で損、ドル買い予約は円安で得。ポジションで判定する。') },

/* ===== 社債 ===== */
{ id:'bond-01', cat:'社債', title:'社債の発行と社債発行費',
  stem:`額面 <b>10,000</b>千円の社債を <b>@96</b> で発行し、払込金は社債発行費 <b>100</b>千円を差し引いた残額を当座預金とした。社債発行費は繰延資産として処理する。`,
  data:'単位：千円<br>発行時の仕訳を完成させよ。',
  dr:[L('当座預金',B('9,500')), L(B('社債発行費'),B('100'))],
  cr:[L('社債',B('9,600'))],
  distractors:['10,000','創立費','400'],
  hint:'社債は「払込金額」で計上。発行費は別建て。',
  explain:EX(['社債は<b>払込金額</b>（額面×発行価格）で計上し、額面との差額は償却原価法で毎期加算する。','社債発行費は繰延資産として計上できる（償還期間にわたり償却）。'],
   '社債：10,000×96%＝<b>9,600</b><br>預金：9,600－100＝<b>9,500</b>',
   '額面10,000で社債を計上し差額を別勘定にする処理は旧基準（社債発行差金）。現在は払込金額で計上。') },

{ id:'bond-02', cat:'社債', title:'償却原価法（定額法）',
  stem:`額面 <b>10,000</b>千円の社債を <b>9,600</b>千円で発行している。償還期間は<b>5年</b>。額面との差額は金利の調整と認められる。`,
  data:'単位：千円／定額法<br>決算時の償却原価法の仕訳を完成させよ。',
  dr:[L(B('社債利息'),B('80'))],
  cr:[L(B('社債'),B('80'))],
  distractors:['400','社債発行費償却','有価証券利息'],
  hint:'発行側は、額面に向けて負債を増やしていく。',
  explain:EX(['発行差額（10,000－9,600＝400）を償還期間で配分し、社債の帳簿価額を増やす。','相手勘定は<b>社債利息</b>（利息の追加負担）。'],
   '400÷5年＝<b>80</b>',
   '「有価証券利息」は保有側（投資者）の勘定。発行側は社債利息。') },

{ id:'bond-03', cat:'社債', title:'社債の買入償還',
  stem:`発行済社債のうち額面 <b>4,000</b>千円分を <b>@98</b> で買入償還し、代金は現金で支払った。買入償還時点の償却原価（額面4,000分）は <b>3,880</b>千円である。`,
  data:'単位：千円<br>買入償還の仕訳を完成させよ。',

  cr:[L('現金預金','3,920')],
  distractors:['4,000','社債償還益','80'],
  hint:'消える負債は「償却原価」。支払額との差が損益。',
  explain:EX(['買入償還では、償還時点までの償却原価法を適用した後の<b>償却原価</b>で社債を減らす。','支払額（4,000×98%＝3,920）との差額が償還損益。'],

   '額面4,000を減らすのは誤り。期中に買い入れる場合は、当期首から償還日までの償却額の計上を忘れずに。') },

{ id:'bond-04', cat:'社債', title:'償却原価法（利息法）',
  stem:`社債（額面 <b>10,000</b>千円、期首の償却原価 <b>9,600</b>千円）の利払日。クーポン利率<b>年3%</b>を現金で支払った。実効利子率は<b>5%</b>。`,

  explain:EX(['利息法：社債利息＝期首償却原価×実効利子率。','クーポン支払額＝額面×表面利率。差額を社債の帳簿価額に加算する。'],
   '社債利息：9,600×5%＝<b>480</b><br>クーポン：10,000×3%＝<b>300</b><br>償却額：480－300＝<b>180</b>',
   '保有側（有価証券）と発行側（社債）で構造は鏡映し。有価証券利息の問題とセットで覚えると速い。') },

{ id:'bond-05', cat:'社債', title:'新株予約権付社債（区分法）の発行',
  stem:`転換社債型以外の新株予約権付社債を発行し、<b>10,000</b>千円の払込みを受けた（当座預金）。区分法を採用し、社債の対価部分は <b>9,000</b>、新株予約権の対価部分は <b>1,000</b>。`,
  data:'単位：千円<br>発行時の仕訳を完成させよ。',

  cr:[L('社債',B('9,000')), L(B('新株予約権'),B('1,000'))],
  distractors:['資本金','新株予約権付社債','資本準備金'],
  hint:'区分法＝社債と新株予約権を分けて計上。',
  explain:EX(['区分法：払込金額を<b>社債</b>（負債）と<b>新株予約権</b>（純資産）に区分して計上する。','一括法（転換社債型で選択可）なら「新株予約権付社債」として一括で負債計上。'],
   '社債 9,000＋新株予約権 1,000＝10,000',
   '新株予約権は純資産の部（株主資本以外）。行使されるまで資本金にはならない。') },

/* ===== 純資産 ===== */
{ id:'eq-01', cat:'純資産', title:'剰余金の配当と利益準備金の積立',
  stem:`繰越利益剰余金を財源として <b>1,000</b>千円の配当を決議した。決議時の資本金 <b>20,000</b>、資本準備金 <b>3,000</b>、利益準備金 <b>1,500</b>。`,

  distractors:['資本準備金','500','未払金'],
  hint:'積立額＝min（配当額×1/10, 資本金×1/4－準備金合計）',
  explain:EX(['準備金の積立額は、<b>配当額の1/10</b>と<b>資本金の1/4に達するまでの額</b>のいずれか小さい方。','財源が繰越利益剰余金なので<b>利益準備金</b>を積み立てる。'],
   '①1,000×1/10＝100<br>②20,000×1/4－（3,000＋1,500）＝500<br>積立額：min（100, 500）＝<b>100</b>',
   '準備金「合計」（資本準備金＋利益準備金）で上限判定する点がひっかけ。') },

{ id:'eq-02', cat:'純資産', title:'自己株式の取得',

{ id:'eq-05', cat:'純資産', title:'ストック・オプションの費用計上',
  stem:`従業員にストック・オプションを付与した。公正な評価額の総額は <b>6,000</b>千円、権利確定日までの対象勤務期間は<b>3年</b>。当期は付与から1年目の決算である。`,

/* ===== 収益認識 ===== */
{ id:'rev-01', cat:'収益認識', title:'取引価格の配分：商品と保守サービス',
  stem:`商品と1年間の保守サービスをセットで <b>10,000</b>千円で販売し、現金で受け取った。商品は引き渡し済み。独立販売価格は商品 <b>9,000</b>、保守サービス <b>3,000</b>。`,

  explain:EX(['履行義務は2つ（商品の引渡し／保守サービス）。','取引価格10,000を独立販売価格の比率（9,000：3,000＝3：1）で配分。','未履行の保守サービス分は、対価を受け取っているので<b>契約負債</b>。'],

{ id:'rev-02', cat:'収益認識', title:'一定期間にわたる履行義務の充足',
  stem:`前問の保守サービス（契約負債 <b>2,500</b>千円、期間<b>1年</b>）について、決算日までに<b>6か月</b>が経過した。`,
  data:'単位：千円<br>決算時の収益計上の仕訳を完成させよ。',
  dr:[L(B('契約負債'),B('1,250'))],
  cr:[L(B('役務収益'),B('1,250'))],
  distractors:['2,500','前受収益','売上原価'],
  hint:'時の経過に応じて履行義務を充足していく。',
  explain:EX(['保守サービスは<b>一定の期間にわたり充足</b>される履行義務。','経過期間に応じて契約負債を取り崩し、収益を認識する。'],

{ id:'rev-03', cat:'収益認識', title:'変動対価：売上リベート',
  stem:`商品 <b>10,000</b>千円を掛けで販売した。顧客との契約により、販売額の <b>5%</b> のリベートを支払う可能性が非常に高いと見積もられた。`,
  data:'単位：千円<br>販売時の仕訳を完成させよ。',

  cr:[L('売上',B('9,500')), L(B('返金負債'),B('500'))],

  hint:'返金する見込み額は、最初から収益に含めない。',

{ id:'rev-04', cat:'収益認識', title:'契約資産の計上',
  stem:`商品Aと商品Bを販売する契約を締結した（Aの対価 <b>2,000</b>、Bの対価 <b>3,000</b>）。代金はA・B両方の引渡し完了後に請求する契約である。当期にAのみ引き渡した。`,
  data:'単位：千円<br>Aの引渡時の仕訳を完成させよ。',
  dr:[L(B('契約資産'),B('2,000'))],
  cr:[L(B('売上'),B('2,000'))],
  distractors:['売掛金','契約負債','5,000'],
  hint:'対価を受け取る権利に、まだ条件が付いている。',
  explain:EX(['Aの履行義務は充足 → 収益を認識する。','ただしBの引渡しが済むまで請求できない（条件付の権利）→ <b>契約資産</b>。','Bの引渡し後、無条件の権利になった時点で売掛金（顧客との契約から生じた債権）に振り替える。'],
   'A：<b>2,000</b>',
   '契約資産＝時の経過以外の条件付き、債権＝時の経過のみで無条件。この定義の違いが問われる。') },

{ id:'rev-05', cat:'収益認識', title:'代理人取引（純額表示）',
  stem:`当社は他社商品の販売を仲介している（在庫リスクを負わず、価格決定権もない＝<b>代理人</b>）。顧客に商品を販売し <b>10,000</b>千円を現金で受け取った。仕入先への支払額は <b>9,000</b>千円（未払い）。`,
  data:'単位：千円<br>販売時の仕訳を完成させよ。',

  distractors:['売上','売上原価','1,100'],
  hint:'代理人は「売上」を総額で計上しない。',
  explain:EX(['代理人の場合、収益は<b>手数料（純額）</b>で認識する。','本人（在庫リスク・価格決定権あり）なら売上10,000／売上原価9,000の総額表示。'],

{ id:'br-01', cat:'本支店会計', title:'本店から支店への商品発送（本店側）',

{ id:'br-02', cat:'本支店会計', title:'本店から支店への商品発送（支店側）',

{ id:'br-05', cat:'本支店会計', title:'未達取引の整理',
  stem:`本店は支店の得意先から売掛金 <b>500</b>千円を回収し、「支店」勘定で処理したが、その通知が決算日までに支店に届いていなかった。`,

  explain:EX(['本店の処理：（借）現金預金 500／（貸）支店 500。','支店は通知を受けていないため未記帳。支店の売掛金が回収された＝売掛金の減少、相手は<b>本店</b>。'],
   '未達額：<b>500</b>',

{ id:'clp-01', cat:'カスタマーロイヤルティプログラム', title:'ポイント付与時の取引価格の配分',

{ id:'clp-02', cat:'カスタマーロイヤルティプログラム', title:'ポイント使用時の収益認識',

  cr:[L(B('売上'),B('200'))],
  distractors:['雑益','ポイント引当金戻入','前受金'],
  hint:'履行義務が消滅した → 繰り延べていた収益はどうなる？',
  explain:EX(['ポイントの失効により履行義務が消滅するため、残っている契約負債を<b>収益</b>として認識する。'],
   '残高：<b>200</b>',
   '失効分を最初から見込んでいれば、失効時の収益は小さくなる。見込みの精度が収益の期間配分を決める。') },

/* ===== 有価証券の保有目的の変更 ===== */
{ id:'chg-01', cat:'有価証券の保有目的の変更', title:'売買目的有価証券 → その他有価証券',
  stem:`正当な理由により、売買目的有価証券（帳簿価額 <b>10,000</b>千円）をその他有価証券に振り替えた。振替時の時価は <b>10,500</b>千円。`,
  data:'単位：千円<br>振替時の仕訳を完成させよ。',
  dr:[L('その他有価証券',B('10,500'))],
  cr:[L('売買目的有価証券','10,000'), L(B('有価証券評価損益'),B('500'))],
  distractors:['その他有価証券評価差額金','10,000','投資有価証券売却益'],
  hint:'売買目的有価証券は、もともと時価の変動を損益に入れる区分。',
  explain:EX(['売買目的有価証券からの振替は<b>振替時の時価</b>で行う。','評価差額は<b>当期の損益</b>（有価証券評価損益）として処理する。'],
   '評価差額：10,500－10,000＝<b>500</b>（益）',
   '変更「前」の区分のルールで評価差額を処理する、と覚える。売買目的→損益。') },

{ id:'chg-02', cat:'有価証券の保有目的の変更', title:'その他有価証券 → 売買目的有価証券',
  stem:`その他有価証券（取得原価 <b>8,000</b>千円、全部純資産直入法、期首の評価差額は洗替済み）を売買目的有価証券に振り替えた。振替時の時価は <b>7,600</b>千円。`,
  data:'単位：千円<br>振替時の仕訳を完成させよ。',
  dr:[L('売買目的有価証券',B('7,600')), L(B('有価証券評価損益'),B('400'))],
  cr:[L('その他有価証券','8,000')],
  distractors:['その他有価証券評価差額金','7,200','8,400'],
  hint:'売買目的へ移すときは、その時点で損益を確定させる。',
  explain:EX(['その他有価証券から売買目的有価証券への振替は<b>振替時の時価</b>で行う。','評価差額は<b>当期の損益</b>とする（以後は売買目的として時価の変動を損益に計上するため）。'],
   '評価差額：7,600－8,000＝－<b>400</b>（損）',
   '売買目的有価証券が絡む振替は、振替元・振替先どちらでも「時価＋損益」になる。') },

{ id:'chg-03', cat:'有価証券の保有目的の変更', title:'子会社株式 → その他有価証券',
  stem:`子会社株式の一部を売却した結果、支配を喪失し、残りの株式（帳簿価額 <b>5,000</b>千円）をその他有価証券に振り替えた。振替時の時価は <b>6,000</b>千円。`,
  data:'単位：千円<br>個別財務諸表上の振替の仕訳を完成させよ。',
  dr:[L(B('その他有価証券'),B('5,000'))],
  cr:[L(B('子会社株式'),B('5,000'))],
  distractors:['6,000','1,000','その他有価証券評価差額金'],
  hint:'子会社株式は取得原価で評価していた区分。',
  explain:EX(['子会社株式・関連会社株式からその他有価証券への振替は、<b>帳簿価額</b>で行う。','期末には、その他有価証券として時価評価する。'],
   '振替額：<b>5,000</b>',
   '振替元が原価評価の区分（子会社・関連会社株式、満期保有目的債券）なら帳簿価額（償却原価）で振り替える。') },

{ id:'chg-04', cat:'有価証券の保有目的の変更', title:'その他有価証券 → 子会社株式',
  stem:`株式を追加取得してS社を子会社としたため、既存保有分のその他有価証券（取得原価 <b>3,000</b>千円、前期末時価 <b>3,400</b>千円、期首に洗替済み）を子会社株式に振り替えた。`,
  data:'単位：千円<br>個別財務諸表上の振替の仕訳を完成させよ。',
  dr:[L(B('子会社株式'),B('3,000'))],
  cr:[L(B('その他有価証券'),B('3,000'))],
  distractors:['3,400','400','投資有価証券評価益'],
  hint:'その他有価証券から子会社株式へは、どの金額で？',
  explain:EX(['その他有価証券から子会社株式・関連会社株式への振替は<b>帳簿価額</b>（取得原価）で行う。','期首に洗替済みなので、帳簿価額は取得原価 3,000。'],
   '振替額：<b>3,000</b>',
   '連結上は段階取得として支配獲得日の時価で再評価し、差額を段階取得に係る差益とする。個別と連結の違いが1級頻出。') },

{ id:'chg-05', cat:'有価証券の保有目的の変更', title:'満期保有目的債券 → その他有価証券',
  stem:`満期保有目的債券の一部を売却したため、残りの満期保有目的債券（償却原価 <b>9,800</b>千円）をその他有価証券に振り替えた。振替時の時価は <b>9,900</b>千円。`,
  data:'単位：千円<br>振替時の仕訳を完成させよ。',
  dr:[L(B('その他有価証券'),B('9,800'))],
  cr:[L(B('満期保有目的債券'),B('9,800'))],
  distractors:['9,900','100','有価証券評価損益'],
  hint:'満期保有目的債券の評価基準は？',
  explain:EX(['満期保有目的債券からその他有価証券への振替は<b>償却原価</b>で行う。','満期保有目的債券の一部を売却すると、残りも満期保有の意思がないとみなされ、振り替える必要がある（いわゆる「汚染」）。'],
   '振替額：<b>9,800</b>',
   '振替後は期末にその他有価証券として時価評価（9,900との差額は評価差額金）。') },

/* ===== その他の包括利益 ===== */
{ id:'oci-01', cat:'その他の包括利益', title:'その他有価証券：期首の振り戻し',
  stem:`前期末にその他有価証券（取得原価 10,000、時価 11,000）を評価し、繰延税金負債 300、その他有価証券評価差額金 700 を計上した（全部純資産直入法、実効税率30%）。`,
  data:'単位：千円／洗替方式<br>当期首の振り戻し仕訳を完成させよ。',
  dr:[L(B('繰延税金負債'),B('300')), L(B('その他有価証券評価差額金'),B('700'))],
  cr:[L('その他有価証券',B('1,000'))],
  distractors:['投資有価証券売却益','繰延税金資産','1,300'],
  hint:'前期末の仕訳をそのまま逆にする。',
  explain:EX(['その他有価証券は洗替方式：期首に前期末の評価仕訳を<b>逆仕訳</b>で戻す。','その結果、帳簿価額は取得原価（10,000）に戻る。'],
   '（前期末）その他有価証券 1,000／繰延税金負債 300・評価差額金 700<br>（期首）その逆',
   '当期に売却すると売却益がP/Lに計上される。過去にOCIで認識済みの部分を包括利益計算書で差し引くのが「組替調整額」。') },

{ id:'oci-02', cat:'その他の包括利益', title:'為替換算調整勘定の非支配株主への按分',
  stem:`在外子会社S社（P社の持分<b>80%</b>）の財務諸表の換算により、当期に為替換算調整勘定（貸方）が <b>1,000</b>千円発生した。`,
  data:'単位：千円<br>非支配株主持分への按分の仕訳を完成させよ。',
  dr:[L(B('為替換算調整勘定'),B('200'))],
  cr:[L(B('非支配株主持分当期変動額'),B('200'))],
  distractors:['800','非支配株主に帰属する当期純利益','その他有価証券評価差額金'],
  hint:'子会社の純資産の増加は、持分比率で非支配株主にも帰属する。',
  explain:EX(['為替換算調整勘定は子会社の純資産の一部 → 非支配株主の持分相当額を<b>非支配株主持分</b>に振り替える。','連結B/Sの為替換算調整勘定には親会社持分（800）だけが残る。'],
   '1,000×20%＝<b>200</b>',
   '包括利益は「親会社株主に係る包括利益」と「非支配株主に係る包括利益」に区分して表示される。') },

{ id:'oci-03', cat:'その他の包括利益', title:'退職給付に係る調整額の組替調整',
  stem:`前期末の未認識数理計算上の差異（借方差異）は 500。当期に個別財務諸表で、そのうち <b>100</b>千円を費用処理した。実効税率<b>30%</b>。`,
  data:'単位：千円<br>連結上、当期の費用処理額に対応する組替調整の仕訳を完成させよ。',
  dr:[L(B('退職給付に係る負債'),'100')],
  cr:[L(B('退職給付に係る調整累計額'),B('70')), L(B('繰延税金資産'),B('30'))],
  distractors:['退職給付費用','繰延税金負債','その他有価証券評価差額金'],
  hint:'個別で費用処理した分、連結の「未認識」部分は減る。',
  explain:EX(['個別で費用処理（退職給付費用／引当金）すると、連結B/Sの負債は二重計上になるので、その分を<b>退職給付に係る負債から減額</b>する。','同額だけ、OCI累計額（調整累計額）と繰延税金資産を取り崩す。'],
   '税効果：100×30%＝<b>30</b><br>調整累計額：100－30＝<b>70</b>',
   'P/Lに振り替わった分をOCIから抜く＝組替調整（リサイクリング）。包括利益の二重計上を防ぐ仕組み。') },

{ id:'oci-04', cat:'その他の包括利益', title:'持分法：関連会社のOCIの取込み',
  stem:`関連会社A社（P社の持分<b>30%</b>）で、当期にその他有価証券評価差額金が <b>1,000</b>千円増加した（税効果考慮後）。`,
  data:'単位：千円<br>持分法による連結修正仕訳を完成させよ。',
  dr:[L('投資有価証券',B('300'))],
  cr:[L(B('その他有価証券評価差額金'),B('300'))],
  distractors:['持分法による投資損益','1,000','700'],
  hint:'関連会社のOCIはP/Lを通さず、OCIのまま持分相当額を取り込む。',
  explain:EX(['持分法では、関連会社のOCIの変動のうち<b>持分相当額</b>を投資勘定に加減する。','相手勘定はP/Lの持分法による投資損益ではなく、<b>その他有価証券評価差額金</b>（OCI）。'],
   '1,000×30%＝<b>300</b>',
   '包括利益計算書では「持分法適用会社に対する持分相当額」として区分表示される。') },

{ id:'oci-05', cat:'その他の包括利益', title:'繰延ヘッジ損益の計上',
  stem:`予定取引のヘッジ目的で保有する先物（繰延ヘッジを適用）について、期末の評価差益が <b>1,000</b>千円生じた。実効税率<b>30%</b>。`,
  data:'単位：千円<br>期末評価の仕訳を完成させよ。',
  dr:[L(B('先物取引差金'),B('1,000'))],
  cr:[L(B('繰延税金負債'),B('300')), L(B('繰延ヘッジ損益'),B('700'))],
  distractors:['先物取引利益','繰延税金資産','その他有価証券評価差額金'],
  hint:'ヘッジ対象の損益が出るまで、ヘッジ手段の損益を繰り延べる。',
  explain:EX(['繰延ヘッジ：ヘッジ手段の評価差額を<b>純資産（繰延ヘッジ損益）</b>に繰り延べる。','評価差益 → 将来加算一時差異 → <b>繰延税金負債</b>。'],
   '繰延税金負債：1,000×30%＝<b>300</b><br>繰延ヘッジ損益：<b>700</b>',
   '繰延ヘッジ損益はOCIの一項目。ヘッジ対象の損益計上時に組替調整される。') },

/* ===== 事業分離と連結会計 ===== */
{ id:'bs-01', cat:'事業分離と連結会計', title:'現金対価の事業分離（投資の清算）',
  stem:`P社はA事業（諸資産 <b>5,000</b>、諸負債 <b>1,000</b>）を、P社と資本関係のないX社に移転し、対価として現金 <b>6,000</b>千円を受け取った。`,
  data:'単位：千円<br>分離元企業（P社）の仕訳を完成させよ。',
  dr:[L('諸負債','1,000'), L('現金預金',B('6,000'))],
  cr:[L('諸資産','5,000'), L(B('移転利益'),B('2,000'))],
  distractors:['4,000','のれん','負ののれん発生益'],
  hint:'現金で受け取った＝投資は清算された。',
  explain:EX(['受取対価が現金など移転した事業と異なる資産 → <b>投資の清算</b> → 移転損益を認識する。','移転損益＝受取対価の時価－移転した事業の株主資本相当額。'],
   '株主資本相当額：5,000－1,000＝4,000<br>移転利益：6,000－4,000＝<b>2,000</b>',
   '「投資の継続か清算か」が事業分離の核心。現金→清算（損益認識）、分離先の株式（子会社・関連会社）→継続（損益なし）。') },

{ id:'bs-02', cat:'事業分離と連結会計', title:'株式対価の事業分離（投資の継続）',
  stem:`P社はA事業（諸資産 <b>5,000</b>、諸負債 <b>1,000</b>、時価 6,000）をS社に移転し、対価としてS社株式を受け取った。これによりS社はP社の<b>子会社</b>となった。`,
  data:'単位：千円<br>分離元企業（P社）の個別上の仕訳を完成させよ。',
  dr:[L('諸負債','1,000'), L(B('子会社株式'),B('4,000'))],
  cr:[L('諸資産','5,000')],
  distractors:['6,000','移転利益','2,000'],
  hint:'子会社株式を受け取った＝投資は継続している。',
  explain:EX(['分離先が子会社となり、対価がその株式 → <b>投資の継続</b> → 移転損益は認識しない。','受け取った株式の取得原価は、移転した事業の<b>株主資本相当額</b>。'],
   '子会社株式：5,000－1,000＝<b>4,000</b>',
   '時価6,000で計上して移転利益2,000を出すのは誤り。事業の実態は何も変わっていない。') },

{ id:'bs-03', cat:'事業分離と連結会計', title:'分離先が子会社になる場合の連結（資本連結）',
  stem:`P社はA事業（株主資本相当額 <b>4,000</b>、時価 <b>6,000</b>）をS社に移転し、S社株式を受け取った（取得原価 4,000）。これによりP社のS社持分は<b>60%</b>となった。移転前のS社の純資産は <b>3,500</b>（時価も同額）、S社の企業価値（時価）は <b>4,000</b>。移転後のS社資本は 7,500。`,
  data:'単位：千円<br>連結上の投資と資本の相殺消去の仕訳を完成させよ。',
  dr:[L('S社資本','7,500'), L(B('のれん'),B('300'))],
  cr:[L('S社株式','4,000'), L(B('非支配株主持分'),B('3,000')), L(B('資本剰余金'),B('800'))],
  distractors:['利益剰余金','負ののれん発生益','2,400','1,600'],
  hint:'①S社の元の事業を取得（のれん）、②A事業の40%を手放した（持分変動差額）の2つに分けて考える。',
  explain:EX(['<b>S社の元の事業の取得</b>：対価＝A事業の時価の40%＝2,400。取得した持分＝3,500×60%＝2,100 → 差額が<b>のれん</b>。','<b>A事業の持分減少</b>：A事業の帳簿価額の40%（1,600）を非支配株主に渡し、時価2,400相当を得た → 差額は<b>持分変動差額（資本剰余金）</b>。','非支配株主持分＝移転後S社資本×40%。'],
   'のれん：6,000×40%－3,500×60%＝2,400－2,100＝<b>300</b><br>持分変動差額：6,000×40%－4,000×40%＝<b>800</b><br>非支配株主持分：7,500×40%＝<b>3,000</b><br>検算：7,500＋300＝4,000＋3,000＋800',
   '持分変動差額は損益ではなく資本剰余金。支配が継続している親会社持分の変動は資本取引として扱う。') },

{ id:'bs-04', cat:'事業分離と連結会計', title:'100%子会社への現金対価の事業分離（連結）',
  stem:`P社はA事業（株主資本相当額 <b>4,000</b>）を100%子会社S社に移転し、現金 <b>6,000</b>千円を受け取った。P社は個別上で移転利益 2,000 を計上し、S社はA事業をP社の帳簿価額で受け入れて差額をのれんとした。`,
  data:'単位：千円<br>連結上の修正仕訳を完成させよ。',
  dr:[L(B('移転利益'),B('2,000'))],
  cr:[L(B('のれん'),B('2,000'))],
  distractors:['非支配株主持分','資本剰余金','6,000'],
  hint:'グループ内の取引で生じた利益は、連結上は未実現。',
  explain:EX(['子会社への事業移転は<b>共通支配下の取引</b>。個別上は移転損益を計上するが、連結上は<b>未実現損益</b>として消去する。','S社側で計上されたのれん（6,000－4,000）と相殺する。'],
   '消去額：<b>2,000</b>',
   'グループ全体で見れば事業の場所が変わっただけ。利益もののれんも発生していない。') },

{ id:'bs-05', cat:'事業分離と連結会計', title:'関連会社への現金対価の事業分離（持分法）',
  stem:`P社はA事業（株主資本相当額 <b>4,000</b>）を関連会社B社（持分<b>30%</b>）に移転し、現金 <b>6,000</b>千円を受け取った。P社は個別上で移転利益 2,000 を計上している。`,

  cr:[L(B('投資有価証券'),B('600'))],
  distractors:['2,000','1,400','持分法による投資損益'],
  hint:'関連会社との取引の未実現損益は、持分相当額だけ消去する。',
  explain:EX(['関連会社への事業移転で生じた移転損益のうち、<b>持分相当額</b>を未実現損益として消去する。','ダウンストリームの消去は投資勘定（投資有価証券）を減額する。'],
   '2,000×30%＝<b>600</b>',
   '子会社なら全額消去、関連会社なら持分相当額のみ消去。消去範囲の違いがポイント。') },

/* ===== 通貨オプション ===== */
{ id:'co-01', cat:'通貨オプション', title:'通貨オプションの購入',
  stem:`ドル建売掛金 <b>1,000ドル</b>の為替リスクに備え、ドルを <b>@140円</b>で売る権利（ドル・プット・オプション）を購入し、オプション料 <b>@2円</b>（総額 2,000円）を現金で支払った。`,

  distractors:['支払手数料','前払費用','140,000'],
  hint:'オプション料は「権利」の購入代金。',

{ id:'co-02', cat:'通貨オプション', title:'通貨オプションの期末評価（独立処理）',
  stem:`前問の通貨オプション（帳簿価額 <b>2,000</b>円）の決算日の時価は <b>3,000</b>円となった。ヘッジ会計は適用しない。`,
  data:'単位：円<br>決算時の評価の仕訳を完成させよ。',
  dr:[L(B('通貨オプション'),B('1,000'))],

  distractors:['3,000','繰延ヘッジ損益','2,000'],
  hint:'デリバティブは時価評価、差額は当期の損益。',
  explain:EX(['デリバティブは期末に<b>時価評価</b>し、評価差額は<b>当期の損益</b>とする（ヘッジ会計を適用しない場合）。'],
   '3,000－2,000＝<b>1,000</b>（評価益）',
   'ヘッジ会計（繰延ヘッジ）を適用すれば、評価差額は繰延ヘッジ損益として純資産に繰り延べる。') },

{ id:'co-03', cat:'通貨オプション', title:'繰延ヘッジを適用した期末評価',
  stem:`予定取引（ドル建売上）をヘッジするために購入した通貨オプションの時価が、期末に帳簿価額より <b>1,000</b>円上昇した。繰延ヘッジを適用し、税効果を考慮する（実効税率<b>30%</b>）。`,
  data:'単位：円<br>決算時の評価の仕訳を完成させよ。',
  dr:[L('通貨オプション',B('1,000'))],
  cr:[L(B('繰延税金負債'),B('300')), L(B('繰延ヘッジ損益'),B('700'))],
  distractors:['為替差損益','繰延税金資産','法人税等調整額'],
  hint:'ヘッジ対象（予定取引）の損益はまだ出ていない。',
  explain:EX(['繰延ヘッジでは、ヘッジ手段の評価差額をヘッジ対象の損益が計上されるまで<b>純資産に繰り延べる</b>。','純資産に直接計上するので、税効果も<b>繰延税金負債</b>を直接控除（法人税等調整額は使わない）。'],
   '繰延税金負債：1,000×30%＝<b>300</b><br>繰延ヘッジ損益：<b>700</b>',
   'ヘッジ手段とヘッジ対象の損益を同じ期に計上させる＝損益の期間的対応を図るのがヘッジ会計の目的。') },

{ id:'co-04', cat:'通貨オプション', title:'オプションの権利行使と売掛金の決済',
  stem:`満期日の直物相場は <b>@135円</b>となったため、ドル・プット・オプション（行使価格 <b>@140円</b>、満期日の評価替え後の帳簿価額 <b>5,000</b>円）を行使し、売掛金 <b>1,000ドル</b>（帳簿価額 <b>142,000</b>円）の回収代金を@140円で円転した。`,
  data:'単位：円<br>決済時の仕訳を完成させよ。',
  dr:[L('現金預金',B('140,000')), L(B('為替差損益'),B('7,000'))],
  cr:[L('売掛金','142,000'), L(B('通貨オプション'),B('5,000'))],
  distractors:['135,000','2,000','3,000'],
  hint:'受取額は行使価格で確定。売掛金の減額と、オプションの消滅を同時に。',
  explain:EX(['行使により@140円でドルを売れる → 受取額 140,000。','オプション（資産 5,000）は行使で消滅する。','差額を為替差損益とする。'],
   '受取：1,000ドル×@140＝<b>140,000</b><br>差損：142,000＋5,000－140,000＝<b>7,000</b>',
   '売掛金の為替差損（142→135：7,000）と、オプションの価値（135→140：5,000）が相殺しあう構造。') },

{ id:'co-05', cat:'通貨オプション', title:'権利の放棄',
  stem:`満期日の直物相場は <b>@145円</b>となった。ドル・プット・オプション（行使価格 <b>@140円</b>、帳簿価額 <b>3,000</b>円）は行使せず放棄した。`,
  data:'単位：円<br>権利放棄時の仕訳を完成させよ。',

  distractors:['5,000','2,000','現金預金'],
  hint:'市場で@145円で売れるのに、@140円で売る権利を使う？',
  explain:EX(['直物（@145）が行使価格（@140）を上回る → 行使すると不利なので<b>放棄</b>する。','オプションの価値はゼロになるので、帳簿価額を全額損失処理する。'],
   '損失：<b>3,000</b>',
   'オプションの買い手の損失は、支払ったオプション料（＋評価益計上分）に限定される。これが予約との違い。') },

/* ===== 売価還元法 ===== */
{ id:'sr-01', cat:'売価還元法', title:'売価還元原価法：期末商品の計算',
  stem:`【資料】期首商品 原価1,600／売価2,000、当期仕入 原価8,000／原始売価10,000、値上額1,000・値上取消額200、値下額1,000・値下取消額200、売上高 <b>9,000</b>。`,
  data:'単位：千円／三分法／売価還元原価法<br>期末商品の振替仕訳を完成させよ（期首分は処理済み）。',
  dr:[L('繰越商品',B('2,400'))],
  cr:[L('仕入',B('2,400'))],
  distractors:['2,250','3,000','2,000'],
  hint:'原価率の分母には、純値上額も純値下額も入れる。',
  explain:EX(['原価法の原価率＝（期首原価＋仕入原価）÷（期首売価＋原始売価＋純値上額－<b>純値下額</b>）。','期末売価（帳簿）＝分母－売上高。'],
   '分母：2,000＋10,000＋800－800＝12,000<br>原価率：9,600÷12,000＝80%<br>期末売価：12,000－9,000＝3,000<br>期末原価：3,000×80%＝<b>2,400</b>',
   '「2,250」は低価法の原価率（75%）を使った場合。原価法と低価法は分母の値下額の扱いだけが違う。') },

{ id:'sr-02', cat:'売価還元法', title:'売価還元低価法：評価損の計上',
  stem:`前問と同じ資料（期末売価 3,000、原価法原価率 80%）。売価還元低価法を採用し、原価法原価率との差額を商品低価評価損として計上する。棚卸減耗はない。`,
  data:'単位：千円<br>決算時の評価損計上の仕訳を完成させよ。',
  dr:[L(B('商品低価評価損'),B('150'))],
  cr:[L(B('繰越商品'),B('150'))],
  distractors:['棚卸減耗損','250','2,250'],
  hint:'低価法の原価率は、分母から値下額を除いて計算する。',
  explain:EX(['低価法原価率＝原価÷（期首売価＋原始売価＋純値上額）＝値下額を<b>控除しない</b>。','分母が大きくなる → 原価率が低くなる → 期末商品が小さく評価される。'],
   '低価法原価率：9,600÷12,800＝75%<br>低価法による期末：3,000×75%＝2,250<br>評価損：2,400－2,250＝<b>150</b>',
   '値下額を分母に入れない＝値下げで失われた価値を期末在庫に負担させる、という発想。') },

{ id:'sr-03', cat:'売価還元法', title:'棚卸減耗損（原価法）',
  stem:`売価還元原価法を採用（原価率 <b>80%</b>）。期末商品の帳簿棚卸高（売価）は <b>3,000</b>、実地棚卸高（売価）は <b>2,800</b>であった。`,
  data:'単位：千円<br>棚卸減耗損を計上する仕訳を完成させよ。',

{ id:'sr-04', cat:'売価還元法', title:'減耗損と評価損の同時計上',

   '減耗損：200×80%＝<b>160</b><br>評価損：2,800×（80%－75%）＝<b>140</b><br>合計：<b>300</b>',
   '評価損を帳簿棚卸高（3,000）で計算すると150。なくなった商品には評価損を計上しない。') },

{ id:'sr-05', cat:'売価還元法', title:'原価率の算定と期末商品',
  stem:`【資料】期首商品 原価900／売価1,200、当期仕入 原価5,100／原始売価6,800、純値上額 400、純値下額 400、売上高 <b>6,000</b>。`,
  data:'単位：千円／三分法／売価還元原価法<br>期末商品の振替仕訳を完成させよ（期首分は処理済み）。',
  dr:[L(B('繰越商品'),B('1,500'))],

   '「1,600」は原価率を80%（期首だけの比率など）と誤ったケース。必ず期首＋当期の合計で計算する。') },

/* ===== 分配可能額の計算 ===== */
{ id:'dist-01', cat:'分配可能額の計算', title:'その他資本剰余金からの配当',
  stem:`その他資本剰余金を財源として <b>2,000</b>千円の配当を決議した。決議時の資本金 <b>10,000</b>、資本準備金 <b>1,500</b>、利益準備金 <b>500</b>。`,

{ id:'dist-02', cat:'分配可能額の計算', title:'2つの財源からの配当',
  stem:`その他資本剰余金 <b>1,000</b>、繰越利益剰余金 <b>3,000</b>を財源に、合計 4,000千円の配当を決議した。資本金 <b>20,000</b>、資本準備金と利益準備金の合計は <b>4,800</b>。`,

{ id:'dist-03', cat:'分配可能額の計算', title:'資本準備金の取崩し（分配可能額の増加）',

{ id:'dist-04', cat:'分配可能額の計算', title:'利益準備金の取崩し',

{ id:'dist-05', cat:'分配可能額の計算', title:'その他資本剰余金による欠損てん補',
  stem:`繰越利益剰余金が <b>1,500</b>千円の借方残高（マイナス）となっている。株主総会の決議により、その他資本剰余金でこれをてん補した。`,
  data:'単位：千円<br>てん補の仕訳を完成させよ。',
  dr:[L(B('その他資本剰余金'),B('1,500'))],

{ id:'dc-01', cat:'直接原価計算', title:'直接原価計算の損益計算書',
  stem:`販売量 <b>1,000個</b>、売価 <b>@100円</b>。変動製造原価 <b>@40円</b>、変動販売費 <b>@10円</b>。固定費（製造・販売・一般管理）合計 <b>30,000円</b>。`,
  data:'単位：円<br>直接原価計算方式の損益計算書を完成させよ。',
  form:F('損益計算書（直接原価計算）',[
    L('売上高','100,000'),
    L('変動売上原価',B('40,000')),
    T('変動製造マージン',B('60,000')),
    L('変動販売費',B('10,000')),
    T('貢献利益',B('50,000')),
    L('固定費','30,000'),
    T('営業利益',B('20,000')),
  ]),
  distractors:['45,000','70,000','50,000'],
  hint:'変動費をすべて引いた後が貢献利益。',
  explain:EX(['売上高－変動売上原価＝<b>変動製造マージン</b>。','変動製造マージン－変動販売費＝<b>貢献利益</b>。','貢献利益－固定費＝営業利益。固定費は全額期間原価。'],
   '変動売上原価：1,000×40＝40,000<br>貢献利益：100,000－40,000－10,000＝50,000<br>営業利益：50,000－30,000＝20,000',
   '全部原価計算では固定製造原価が製品原価に含まれるが、直接原価計算では発生額全額がその期の費用。') },

{ id:'dc-02', cat:'直接原価計算', title:'固定費調整（期末在庫のみ）',
  stem:`当期の生産量 <b>1,200個</b>、販売量 <b>1,000個</b>（期首在庫なし）。固定製造原価 <b>60,000円</b>。直接原価計算の営業利益は <b>20,000円</b>。`,
  data:'単位：円<br>全部原価計算の営業利益に調整する計算表を完成させよ。',
  form:F('固定費調整',[
    L('直接原価計算の営業利益','20,000'),
    L('（＋）期末在庫に含まれる固定製造原価',B('10,000')),
    L('（－）期首在庫に含まれる固定製造原価',B('0')),
    T('全部原価計算の営業利益',B('30,000')),
  ]),
  distractors:['12,000','10,000','32,000'],
  hint:'単位当たり固定製造原価＝60,000÷生産量。',
  explain:EX(['全部原価計算では、固定製造原価の一部が<b>期末在庫に含まれて次期へ繰り越される</b>。','その分、当期の費用が少なくなり利益が大きくなる。'],
   '単位当たり：60,000÷1,200＝50<br>期末在庫分：200×50＝<b>10,000</b><br>全部原価計算：20,000＋10,000＝<b>30,000</b>',
   '「12,000」は販売量1,000で割ったミス。固定製造原価の単価は生産量で割る。') },

{ id:'dc-03', cat:'直接原価計算', title:'固定費調整（期首・期末在庫あり）',
  stem:`単位当たり固定製造原価は前期・当期とも <b>@50円</b>。期首製品 <b>100個</b>、期末製品 <b>300個</b>（仕掛品なし）。直接原価計算の営業利益は <b>40,000円</b>。`,
  data:'単位：円<br>固定費調整の計算表を完成させよ。',
  form:F('固定費調整',[
    L('直接原価計算の営業利益','40,000'),
    L('（＋）期末在庫の固定製造原価',B('15,000')),
    L('（－）期首在庫の固定製造原価',B('5,000')),
    T('全部原価計算の営業利益',B('50,000')),
  ]),
  distractors:['60,000','30,000','10,000'],
  hint:'期末に繰り越す分は足し、期首から繰り越された分は引く。',
  explain:EX(['期首在庫の固定製造原価は、全部原価計算では<b>当期の売上原価</b>になる → 全部原価計算の利益が小さくなる。','期末在庫の固定製造原価は、<b>次期に繰り越される</b> → 全部原価計算の利益が大きくなる。'],
   '期末：300×50＝<b>15,000</b>／期首：100×50＝<b>5,000</b><br>全部原価計算：40,000＋15,000－5,000＝<b>50,000</b>',
   '「ころがし調整法」の基本。在庫が増えると全部原価計算の利益は膨らむ。') },

{ id:'dc-04', cat:'直接原価計算', title:'在庫変動と利益の関係',
  stem:`全部原価計算と直接原価計算の営業利益を比較する（単位当たり固定製造原価は毎期一定とする）。`,
  data:'各ケースについて、両者の営業利益の関係を選べ。',
  form:F('営業利益の大小関係',[
    L('生産量 ＞ 販売量（在庫増加）',B('全部＞直接')),
    L('生産量 ＜ 販売量（在庫減少）',B('全部＜直接')),
    L('生産量 ＝ 販売量',B('一致')),
    L('期首・期末とも在庫ゼロ',B('一致')),
  ]),
  distractors:['全部＞直接'],
  hint:'全部原価計算では、固定製造原価が在庫とともに移動する。',
  explain:EX(['在庫が増えると、固定製造原価の一部が在庫に残り費用にならない → <b>全部原価計算の利益が大きい</b>。','在庫が減ると、前期の固定製造原価まで費用になる → <b>全部原価計算の利益が小さい</b>。','在庫が変わらなければ（単価一定の場合）両者は一致する。'],
   '',
   '全部原価計算では「作れば利益が増える」現象が起きる。直接原価計算が内部管理に向く理由の1つ。') },

{ id:'dc-05', cat:'直接原価計算', title:'単位当たり原価と貢献利益',
  stem:`製品1個当たり：直接材料費 <b>30円</b>、直接労務費（変動） <b>20円</b>、変動製造間接費 <b>10円</b>、固定製造間接費 <b>50円</b>（正常操業度ベース）、変動販売費 <b>5円</b>。売価は <b>100円</b>。`,
  data:'単位：円<br>単位当たりの金額を完成させよ。',
  form:F('単位当たりの計算',[
    L('直接原価計算の製品単位原価',B('60')),
    L('全部原価計算の製品単位原価',B('110')),
    T('単位当たり貢献利益',B('35')),
  ]),
  distractors:['40','65','115','45'],
  hint:'販売費は製品原価に含まれない。',
  explain:EX(['直接原価計算の製品原価＝<b>変動製造原価</b>のみ（30＋20＋10）。','全部原価計算の製品原価＝変動製造原価＋固定製造間接費。','貢献利益＝売価－<b>すべての変動費</b>（変動販売費を含む）。'],
   '直接：30＋20＋10＝<b>60</b><br>全部：60＋50＝<b>110</b><br>貢献利益：100－60－5＝<b>35</b>',
   '「40」は変動販売費を引き忘れたミス。貢献利益は変動製造マージンとは違う。') },

/* ===== 意思決定会計 ===== */
{ id:'dm-01', cat:'意思決定会計', title:'特別注文の受諾',
  stem:`遊休生産能力がある。顧客から <b>1,000個</b>を <b>@70円</b>で購入したいという特別注文を受けた。製品の単位原価は変動費 <b>@50円</b>、固定費配賦額 <b>@30円</b>。受注には追加の固定費 <b>5,000円</b>が必要。`,
  data:'単位：円<br>差額原価収益分析を完成させよ。',
  form:F('差額原価収益分析',[
    L('差額収益',B('70,000')),
    L('差額原価（変動費）',B('50,000')),
    L('追加固定費','5,000'),
    T('差額利益',B('15,000')),
    L('判定',B('受諾する')),
  ]),
  distractors:['80,000','断る','30,000'],
  hint:'既存の固定費は受注してもしなくても変わらない。',
  explain:EX(['遊休能力があるので、既存の固定費（配賦額@30）は<b>埋没原価</b>で意思決定に無関連。','受注で増えるのは変動費と追加固定費だけ。'],
   '差額収益：1,000×70＝70,000<br>差額原価：1,000×50＋5,000＝55,000<br>差額利益：<b>15,000</b> → 受諾',
   '全部原価（@80）と売価（@70）を比べて「赤字だから断る」のは典型的な誤り。') },

{ id:'dm-02', cat:'意思決定会計', title:'部品の自製か購入か',
  stem:`部品1,000個を自製するか外部購入するか検討中。自製の場合、変動費 <b>@40円</b>、回避可能な固定費 <b>10,000円</b>、工場共通固定費の配賦額 <b>20,000円</b>（購入しても発生する）。購入価格は <b>@48円</b>。`,
  data:'単位：円<br>関連原価による比較表を完成させよ。',
  form:F('関連原価の比較',[
    L('自製の関連原価',B('50,000')),
    L('購入の関連原価',B('48,000')),
    T('購入による原価節約額',B('2,000')),
    L('判定',B('購入する')),
  ]),
  distractors:['70,000','自製する','22,000'],
  hint:'購入しても発生する固定費は、比較に含めない。',
  explain:EX(['自製の関連原価＝変動費＋<b>回避可能固定費</b>。','共通固定費の配賦額は、どちらを選んでも発生する<b>埋没原価</b>。'],
   '自製：1,000×40＋10,000＝<b>50,000</b><br>購入：1,000×48＝<b>48,000</b><br>購入の方が <b>2,000</b> 有利',
   '「70,000」は共通固定費を含めたミス。含めると自製が不当に不利に見える。') },

{ id:'dm-03', cat:'意思決定会計', title:'不採算セグメントの廃止',
  stem:`製品Bの損益：売上高 <b>50,000</b>、変動費 <b>35,000</b>、個別固定費 <b>10,000</b>（廃止すれば発生しない）、共通固定費の配賦額 <b>8,000</b>（廃止しても発生する）。製品Bの営業損益は △3,000。`,
  data:'単位：円<br>セグメント別分析を完成させよ。',
  form:F('製品Bのセグメント分析',[
    L('貢献利益',B('15,000')),
    T('セグメント・マージン',B('5,000')),
    L('廃止した場合の全社利益',B('5,000減少')),
    L('判定',B('継続する')),
  ]),
  distractors:['3,000増加','廃止する','7,000'],
  hint:'廃止すると、共通固定費の配賦額は他の製品に付け替わるだけ。',
  explain:EX(['セグメント・マージン＝貢献利益－<b>個別固定費</b>。これがプラスなら、そのセグメントは共通固定費の回収に貢献している。','廃止すると、セグメント・マージン分だけ全社利益が減る。'],
   '貢献利益：50,000－35,000＝<b>15,000</b><br>セグメント・マージン：15,000－10,000＝<b>5,000</b>',
   '営業損益（△3,000）だけ見て廃止すると、全社利益は逆に5,000減る。') },

{ id:'dm-04', cat:'意思決定会計', title:'追加加工の意思決定',
  stem:`中間製品 <b>1,000個</b>は、そのまま <b>@30円</b>で販売できるが、追加加工すれば <b>@50円</b>で販売できる。追加加工には変動費 <b>@15円</b>と、回避可能な固定費 <b>2,000円</b>がかかる。`,
  data:'単位：円<br>差額分析を完成させよ。',
  form:F('追加加工の差額分析',[
    L('差額収益',B('20,000')),
    L('差額原価',B('17,000')),
    T('差額利益',B('3,000')),
    L('判定',B('追加加工する')),
  ]),
  distractors:['15,000','そのまま販売','5,000'],
  hint:'追加加工で「増える」収益と原価だけを比べる。',
  explain:EX(['差額収益＝（50－30）×1,000。','差額原価＝追加加工の変動費＋回避可能固定費。','分離点までの原価は、どちらを選んでも同じなので無関連。'],
   '差額収益：<b>20,000</b><br>差額原価：15×1,000＋2,000＝<b>17,000</b><br>差額利益：<b>3,000</b>',
   '「5,000」は回避可能固定費を見落としたミス。') },

{ id:'dm-05', cat:'意思決定会計', title:'原価の分類：埋没原価と機会原価',
  stem:`旧機械を使い続けるか、新機械に取り替えるかを検討している。`,
  data:'各項目が意思決定上どの原価に当たるかを選べ。',
  form:F('原価の分類',[
    L('旧機械の取得原価（過去に支出済み）',B('埋没原価')),
    L('旧機械を今売却すれば得られる代金',B('機会原価')),
    L('新機械の導入で増える保守費',B('差額原価')),
    L('先月支出した市場調査費',B('埋没原価')),
  ]),
  distractors:['固定費'],
  hint:'将来の選択によって変わるかどうかで判断する。',
  explain:EX(['<b>埋没原価</b>：過去に発生済みで、どの案を選んでも変わらない原価。意思決定には無関連。','<b>機会原価</b>：ある案を選んだために諦めた、他の案の最大の利益（使い続ければ売却代金を諦める）。','<b>差額原価</b>：案によって金額が変わる原価。意思決定に関連する。'],
   '',
   '旧機械の帳簿価額や取得原価は、いくら大きくても判断材料にならない。') },

/* ===== 予算編成 ===== */
{ id:'bud-01', cat:'予算編成', title:'製造予算と材料購入予算',
  stem:`次期の販売予算は <b>1,000個</b>。製品の期首在庫 <b>100個</b>、期末在庫目標 <b>150個</b>。製品1個に材料 <b>2kg</b>を使う。材料の期首在庫 <b>200kg</b>、期末在庫目標 <b>300kg</b>。`,
  data:'仕掛品はないものとする。<br>予算の計算表を完成させよ。',
  form:F('製造予算・材料購入予算',[
    L('製造量（個）',B('1,050')),
    L('材料消費量（kg）',B('2,100')),
    T('材料購入量（kg）',B('2,200')),
  ]),
  distractors:['950','2,000','1,900'],
  hint:'製造量＝販売量＋期末在庫－期首在庫。購入量も同じ形。',
  explain:EX(['製造量＝販売量＋期末製品－期首製品。','材料購入量＝材料消費量＋期末材料－期首材料。'],
   '製造量：1,000＋150－100＝<b>1,050</b><br>消費量：1,050×2＝<b>2,100</b><br>購入量：2,100＋300－200＝<b>2,200</b>',
   '販売予算→製造予算→材料購入予算と、上流から順につながるのが予算編成の構造。') },

{ id:'bud-02', cat:'予算編成', title:'現金収入予算（売掛金の回収）',
  stem:`売上のうち <b>20%</b>は現金売上、<b>80%</b>は掛売上で翌月に全額回収する。前月の売上高は <b>80,000円</b>、当月の売上高は <b>100,000円</b>。`,
  data:'単位：円<br>当月の現金収入予算を完成させよ。',
  form:F('当月の現金収入',[
    L('当月の現金売上',B('20,000')),
    L('前月の掛売上の回収',B('64,000')),
    T('現金収入合計',B('84,000')),
  ]),
  distractors:['80,000','16,000','100,000'],
  hint:'当月の掛売上は、来月まで入金されない。',
  explain:EX(['当月の現金売上は当月入金。','掛売上は翌月回収なので、当月入金するのは<b>前月</b>の掛売上。'],
   '現金売上：100,000×20%＝<b>20,000</b><br>回収：80,000×80%＝<b>64,000</b><br>合計：<b>84,000</b>',
   '売上高（損益予算）と収入（資金予算）はずれる。このずれが資金繰りの肝。') },

{ id:'bud-03', cat:'予算編成', title:'現金支出予算（非資金費用に注意）',
  stem:`仕入はすべて掛けで、<b>40%</b>を当月、<b>60%</b>を翌月に支払う。前月の仕入 <b>40,000円</b>、当月の仕入 <b>50,000円</b>。そのほか当月の給料 <b>10,000円</b>（当月払い）、減価償却費 <b>3,000円</b>。`,
  data:'単位：円<br>当月の現金支出予算を完成させよ。',
  form:F('当月の現金支出',[
    L('仕入代金の支払',B('44,000')),
    L('給料','10,000'),
    L('減価償却費',B('0')),
    T('現金支出合計',B('54,000')),
  ]),
  distractors:['3,000','50,000','57,000'],
  hint:'減価償却費はお金が出ていく費用？',
  explain:EX(['当月の支払＝当月仕入の40%＋前月仕入の60%。','減価償却費は<b>非資金費用</b>なので、現金支出予算には含めない。'],
   '仕入の支払：50,000×40%＋40,000×60%＝20,000＋24,000＝<b>44,000</b><br>合計：44,000＋10,000＝<b>54,000</b>',
   '「57,000」は減価償却費を含めたミス。資金予算では非資金項目を必ず除く。') },

{ id:'bud-04', cat:'予算編成', title:'売上高差異の分析',
  stem:`予算：売価 <b>@100円</b>×販売量 <b>1,000個</b>＝100,000円。実績：売価 <b>@98円</b>×販売量 <b>1,100個</b>＝107,800円。`,
  data:'売上高差異を販売価格差異と販売数量差異に分析する。単位：円',
  form:F('売上高差異の分析',[
    L('販売価格差異（金額）',B('2,200')),
    L('販売価格差異（判定）',B('不利')),
    L('販売数量差異（金額）',B('10,000')),
    L('販売数量差異（判定）',B('有利')),
  ]),
  distractors:['2,000','11,000','不利'],
  hint:'価格差異は実際数量で、数量差異は予算価格で計算する（原価差異と同じ構造）。',
  explain:EX(['販売価格差異＝（実際売価－予算売価）×<b>実際販売量</b>。','販売数量差異＝（実際販売量－予算販売量）×<b>予算売価</b>。','収益の差異なので、実際が予算を上回れば有利。'],
   '価格差異：（98－100）×1,100＝－<b>2,200</b>（不利）<br>数量差異：（1,100－1,000）×100＝＋<b>10,000</b>（有利）<br>合計：＋7,800＝107,800－100,000',
   '原価差異とは有利・不利の向きが逆。収益は多いほど有利、原価は少ないほど有利。') },

{ id:'bud-05', cat:'予算編成', title:'変動予算による予算差異',
  stem:`製造間接費予算：変動費率 <b>@300円/時間</b>、固定費 <b>500,000円</b>（基準操業度 1,000時間）。当月の実際操業度は <b>900時間</b>、実際発生額は <b>780,000円</b>。`,

   '「固定予算では有利（800,000－780,000）なのに変動予算では不利」。業績評価には変動予算が適する。') },

/* ===== 実際工程別総合原価計算 ===== */
{ id:'proc-01', cat:'実際工程別総合原価計算', title:'工程完了品の振替（累加法）',
  stem:`第1工程の当月完了品原価は <b>300,000円</b>。このうち <b>1/3</b>は半製品として倉庫に保管し、残りは第2工程に振り替えた。`,
  data:'累加法。単位：円<br>第1工程完了品の振替仕訳を完成させよ。',
  dr:[L(B('第2工程仕掛品'),B('200,000')), L(B('半製品'),B('100,000'))],
  cr:[L(B('第1工程仕掛品'),'300,000')],
  distractors:['製品','300,000','150,000'],
  hint:'第1工程の完了品は、第2工程では「前工程費」として投入される。',
  explain:EX(['累加法：前工程の完了品原価を<b>次工程の仕掛品</b>に前工程費として振り替える。','次工程に投入せず保管するものは<b>半製品</b>勘定へ。'],
   '第2工程へ：300,000×2/3＝<b>200,000</b><br>半製品：300,000×1/3＝<b>100,000</b>',
   '第1工程の完了品は「製品」ではない。最終工程の完成品だけが製品になる。') },

{ id:'proc-02', cat:'実際工程別総合原価計算', title:'第1工程：平均法',
  stem:`月初仕掛品 <b>100個</b>（進捗度50%：材料費 2,000、加工費 1,500）。当月投入 <b>900個</b>（材料費 18,000、加工費 16,500）。完成 <b>800個</b>、月末仕掛品 <b>200個</b>（進捗度<b>50%</b>）。材料は始点投入。`,
  data:'平均法。単位：円<br>計算表を完成させよ。',
  form:F('第1工程の原価計算（平均法）',[
    L('月末仕掛品：材料費',B('4,000')),
    L('加工費の換算量合計（個）',B('900')),
    L('月末仕掛品：加工費',B('2,000')),
    T('完了品総合原価',B('32,000')),

  distractors:['3,600','1,000','2,250','34,000'],
  hint:'平均法：月初と当月投入を合算して単価を出す。',
  explain:EX(['平均法：（月初＋当月投入）÷（完成＋月末換算量）で単価を算定。','材料は始点投入なので月末200個、加工費は200×50%＝100個。'],
   '材料単価：（2,000＋18,000）÷1,000＝20 → 月末 200×20＝<b>4,000</b><br>加工換算量：800＋100＝<b>900</b><br>加工単価：（1,500＋16,500）÷900＝20 → 月末 100×20＝<b>2,000</b><br>完了品：（20,000－4,000）＋（18,000－2,000）＝<b>32,000</b>',
   '換算量合計（900）は、完成品800＋月末換算量100。月初の換算量は平均法では足さない。') },

{ id:'proc-03', cat:'実際工程別総合原価計算', title:'第2工程：前工程費（先入先出法）',
  stem:`第2工程の月初仕掛品 <b>100個</b>（前工程費 2,100）。当月の前工程費投入 <b>900個</b>で <b>18,000円</b>。完成 <b>800個</b>、月末仕掛品 <b>200個</b>。`,

  form:F('第2工程の前工程費（先入先出法）',[
    L('前工程費の投入の仕方',B('始点投入')),
    L('月末仕掛品の前工程費',B('4,000')),
    T('完成品の前工程費',B('16,100')),

  distractors:['平均的投入','4,020','16,000'],
  hint:'前工程費は、第2工程の始点で投入される材料と同じ扱い。',
  explain:EX(['前工程費は第2工程の<b>始点で投入</b>される（進捗度に関係なく100%）。','先入先出法：月末仕掛品は<b>当月投入分</b>から構成される。'],
   '当月単価：18,000÷900＝20<br>月末：200×20＝<b>4,000</b><br>完成品：2,100＋18,000－4,000＝<b>16,100</b>',
   '月末仕掛品の加工進捗度が何%でも、前工程費は100%で計算する。') },

{ id:'proc-04', cat:'実際工程別総合原価計算', title:'正常仕損：終点発生（度外視法）',
  stem:`当月投入 <b>1,000個</b>（材料費 <b>20,000円</b>、始点投入）。完成 <b>800個</b>、正常仕損 <b>50個</b>（<b>工程の終点</b>で発生、評価額なし）、月末仕掛品 <b>150個</b>（進捗度40%）。月初仕掛品なし。`,
  data:'度外視法。単位：円<br>材料費の計算表を完成させよ。',
  form:F('材料費の配分',[
    L('正常仕損費の負担',B('完成品のみ')),

    T('完成品の材料費',B('17,000')),

  distractors:['両者負担','3,158','16,842'],
  hint:'終点で発生した仕損は、終点に達していない月末仕掛品とは無関係。',
  explain:EX(['仕損が<b>終点</b>で発生 → 月末仕掛品は終点を通過していない → <b>完成品のみ負担</b>。','度外視法の完成品のみ負担：仕損品の数量も含めて按分し、仕損分を完成品に加える。'],
   '単価：20,000÷1,000＝20<br>月末：150×20＝<b>3,000</b><br>完成品：20,000－3,000＝<b>17,000</b>（仕損分1,000を含む）',
   '「3,158」は分母から仕損を除いた（両者負担の計算）ミス。発生点と月末仕掛品の進捗度を比べて負担者を決める。') },

{ id:'proc-05', cat:'実際工程別総合原価計算', title:'正常仕損：始点発生（度外視法）',
  stem:`当月投入 <b>1,050個</b>（材料費 <b>21,000円</b>、始点投入）。正常仕損 <b>50個</b>（<b>工程の始点</b>で発生、評価額なし）、完成 <b>800個</b>、月末仕掛品 <b>200個</b>（進捗度50%）。月初仕掛品なし。`,
  data:'度外視法。単位：円<br>材料費の計算表を完成させよ。',
  form:F('材料費の配分',[
    L('正常仕損費の負担',B('両者負担')),

   '単価：21,000÷（800＋200）＝21<br>月末：200×21＝<b>4,200</b><br>完成品：800×21＝<b>16,800</b>',
   '「4,000」は仕損を分母に含めて（21,000÷1,050＝20）計算したミス。') },

/* ===== 配合差異と歩留差異 ===== */
{ id:'mix-01', cat:'配合差異と歩留差異', title:'標準投入量と標準平均単価',
  stem:`原料の標準配合：原料A <b>60%</b>（@100円）、原料B <b>40%</b>（@50円）。標準歩留率は <b>80%</b>（原料10kgから製品8kg）。当月の製品産出量は <b>800kg</b>。`,
  data:'単位：kg・円<br>差異分析の基礎数値を完成させよ。',
  form:F('差異分析の基礎数値',[
    L('標準投入量（kg）',B('1,000')),

   '投入量：800÷80%＝<b>1,000</b>（A 600／B 400）<br>平均単価：100×60%＋50×40%＝<b>80</b><br>製品1kg当たり：80÷80%＝<b>100</b>',
   '「640」は産出量800に歩留率80%を掛けたミス。投入→産出は掛け算、産出→投入は割り算。') },

{ id:'mix-02', cat:'配合差異と歩留差異', title:'配合差異の計算',
  stem:`前問の標準（A 60% @100円、B 40% @50円）。当月の実際投入量は原料A <b>700kg</b>、原料B <b>400kg</b>（合計1,100kg）。実際単価は標準と同じ。`,
  data:'単位：円<br>配合差異を原料別に計算せよ。',
  form:F('配合差異',[
    L('原料A（金額）',B('4,000')),
    L('原料A（判定）',B('不利')),
    L('原料B（金額）',B('2,000')),
    L('原料B（判定）',B('有利')),
    T('配合差異合計（不利）',B('2,000')),

  distractors:['10,000','6,000','不利'],
  hint:'配合差異＝（実際投入量合計を標準配合で割り振った量－実際の量）×標準単価',
  explain:EX(['実際投入量合計1,100kgを<b>標準配合</b>で割り振る：A 660kg、B 440kg。','その量と実際の量の差に標準単価を掛ける。'],
   'A：（660－700）×100＝－<b>4,000</b>（不利）<br>B：（440－400）×50＝＋<b>2,000</b>（有利）<br>合計：－<b>2,000</b>（不利）',
   '配合差異は「割高な原料を多く使ったか」を表す。高い原料Aを多く使いすぎた。') },

{ id:'mix-03', cat:'配合差異と歩留差異', title:'歩留差異の計算',
  stem:`前問と同じ条件。標準投入量は <b>1,000kg</b>（産出800kg÷歩留率80%）、実際投入量は <b>1,100kg</b>、標準平均単価は <b>@80円</b>。`,
  data:'単位：円<br>歩留差異を計算せよ。',

    L('投入量の差（kg）',B('100')),
    L('歩留差異（金額）',B('8,000')),

  distractors:['有利','10,000','6,400'],
  hint:'歩留差異＝（標準投入量－実際投入量）×標準平均単価',

   '歩留差異：（1,000－1,100）×80＝－<b>8,000</b>（不利）<br>数量差異：配合2,000＋歩留8,000＝<b>10,000</b>（不利）',
   '数量差異（原料別に計算）＝配合差異＋歩留差異。A：（600－700）×100＝－10,000、B：0で検算できる。') },

{ id:'mix-04', cat:'配合差異と歩留差異', title:'配合差異・歩留差異の仕訳',
  stem:`パーシャル・プラン。仕掛品勘定には実際投入量×標準単価（A 700kg×@100＋B 400kg×@50＝<b>90,000円</b>）が借記されている。製品産出量 <b>800kg</b>の標準原価は <b>80,000円</b>。`,
  data:'単位：円<br>完成品の振替と差異の振替仕訳を完成させよ。',
  dr:[L(B('製品'),B('80,000')), L(B('配合差異'),B('2,000')), L(B('歩留差異'),B('8,000'))],
  cr:[L('仕掛品','90,000')],
  distractors:['10,000','材料価格差異','88,000'],
  hint:'仕掛品勘定の貸借差額10,000を、2つの差異に分ける。',

   '価格差異は材料の受入時（または消費時）に別途把握されるので、ここには出てこない。') },

{ id:'mix-05', cat:'配合差異と歩留差異', title:'有利差異のケース',
  stem:`標準：A 60%（@100円）、B 40%（@50円）、標準歩留率<b>80%</b>、標準平均単価 @80円。当月の実際投入量は A <b>550kg</b>、B <b>450kg</b>（合計1,000kg）、製品産出量は <b>820kg</b>。`,

/* ===== 最適セールスミックス ===== */
{ id:'sm-01', cat:'最適セールスミックス', title:'制約条件1つ：優先順位の判定',
  stem:`製品Xの単位当たり貢献利益 <b>@60円</b>（機械時間 <b>3時間</b>/個）、製品Yは <b>@40円</b>（機械時間 <b>1時間</b>/個）。機械時間には上限がある。`,

  stem:`製品Xの貢献利益 <b>@30円</b>、製品Yは <b>@20円</b>。<br>・機械時間：X 2時間、Y 1時間、上限 <b>1,000時間</b><br>・作業時間：X 1時間、Y 2時間、上限 <b>800時間</b>`,

    L('品質管理の教育訓練費',B('予防原価')),

  back: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  puzzle: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 7h3.5a2 2 0 1 1 4 0H15v3.5a2 2 0 1 1 0 4V18h-3.5a2 2 0 1 0-4 0H4v-3.5a2 2 0 1 0 0-4z"/></svg>',
  shuffle: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>',
  chev: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  clock: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'
};

/* =========================================================
   メニュー画面
   ========================================================= */
let menuMode = 'all'; // 'all' | 'review'
function renderMenu() {
  S = null;
  const review = getReview();
  const solved = getSolved();
  const total = QUESTIONS.length;
  const rv = menuMode === 'review';

  const hero = `
    <header class="hero">
      <div class="brand"><img class="brand-mark" src="${MARK}" alt=""><span>SHIWAKE PUZZLE</span></div>
      <h1>簿記1級 仕分けパズル<span class="ver">ver.1</span></h1>
      <p>メモ・電卓なしで仕訳の構造を組み立てる</p>
    </header>
    <div class="seg" role="tablist">
      <button class="${rv ? '' : 'on'}" data-act="mode" data-mode="all">すべての問題</button>
      <button class="${rv ? 'on' : ''}" data-act="mode" data-mode="review">要復習のみ（${review.length}）</button>
    </div>
    ${rv ? `
      <button class="banner ng" data-act="review" ${review.length ? '' : 'disabled'}>
        <span class="banner-ic">${ICON.retry}</span>
        <span class="banner-tx"><b>要復習モード</b><small>${review.length ? `間違えた${review.length}問を連続で解き直す` : '間違えた問題はありません'}</small></span>
        <span class="banner-go">${ICON.chev}</span>
      </button>` : `
      <button class="banner" data-act="random">
        <span class="banner-ic">${ICON.shuffle}</span>
        <span class="banner-tx"><b>全範囲からランダム</b><small>全${total}問からランダム出題</small></span>
        <span class="banner-go">${ICON.chev}</span>
      </button>`}
    <div class="divider"><span>${rv ? '論点ごとに復習' : '論点を選んで演習'}</span></div>`;

  const secHtml = SECTIONS.map(sec => {
    const cats = rv ? sec.cats.filter(c => review.some(id => qById(id).cat === c)) : sec.cats;
    if (!cats.length) return '';
    return `
    <div class="sec-title">${sec.label}</div>
    <div class="grid">
      ${cats.map(c => {
        const qs = QUESTIONS.filter(q => q.cat === c);
        const n = rv ? review.filter(id => qById(id).cat === c).length : qs.length;
        const done = !rv && qs.length && qs.every(q => solved[q.id]);
        return `<button class="cat ${n ? 'live' : 'empty'} ${rv ? 'rv' : ''}" data-act="${rv ? 'review-cat' : 'cat'}" data-cat="${c}">
          <div class="cat-top"><span class="cat-ic">${rv ? ICON.retry : ICON.book}</span><span class="cat-badge">${n}問</span></div>
          <div class="cat-name">${c}${done ? '<span class="cat-done">✓</span>' : ''}</div>
        </button>`;
      }).join('')}
    </div>`;
  }).join('');

  const empty = rv && !review.length
    ? `<div class="empty-note">不正解だった問題がここに自動で登録されます。<br>正解すると自動で消えます。</div>` : '';

  $app.innerHTML = `
    <main class="wrap">${hero}${secHtml}${empty}
      <p class="foot">記録はこの端末のブラウザに保存されます（オフライン動作）</p>
    </main>`;
}

/* =========================================================
   クイズ
   ========================================================= */
let S = null; // セッション状態

function startSession(mode, ids, label) {
  S = { mode, ids, label, idx: 0, score: 0 };
  loadQuestion();
}

function loadQuestion() {
  const q = qById(S.ids[S.idx]);
  const blanks = [], bmap = {};
  if (q.form) {
    q.form.rows.forEach((line, i) => {
      for (const f of ['acc', 'amt']) {
        if (typeof line[f] === 'object') { bmap[`fm-${i}-${f}`] = blanks.length; blanks.push({ ans: line[f].b, f }); }
      }
    });
  }
  const rows = q.form ? 0 : Math.max(q.dr.length, q.cr.length);
  for (let i = 0; i < rows; i++) {
    for (const side of ['dr', 'cr']) {
      const line = q[side][i]; if (!line) continue;
      for (const f of ['acc', 'amt']) {
        if (typeof line[f] === 'object') { bmap[`${side}-${i}-${f}`] = blanks.length; blanks.push({ ans: line[f].b, f }); }
      }
    }
  }
  const pool = [...blanks.map(b => b.ans), ...(q.distractors || [])];
  // 勘定科目 → 金額の順に並べ、グループ内はシャッフル（親指で探しやすく）
  const accs = shuffle(pool.filter(t => !isNum(t)));
  const nums = shuffle(pool.filter(isNum));
  S.q = q; S.blanks = blanks; S.bmap = bmap;
  S.parts = [...accs, ...nums].map((t, i) => ({ id: i, text: t }));
  S.fills = Array(blanks.length).fill(null);
  S.active = 0; S.answered = false; S.showHint = false; S.result = null;
  renderQuiz(true);
}

function nextEmpty(from) {
  const n = S.fills.length;
  for (let k = 0; k < n; k++) { const i = (from + k) % n; if (S.fills[i] === null) return i; }
  return -1;
}

function slotHtml(key, v, f) {
    if (typeof v !== 'object') return `<div class="fx ${f}">${v}</div>`;
    const b = S.bmap[key];
    const pid = S.fills[b];
    const text = pid === null ? '' : S.parts[pid].text;
    let cls = 'slot ' + f;
    if (pid === null) cls += ' empty'; else cls += ' filled';
    if (!S.answered && b === S.active) cls += ' active';
    if (S.answered) cls += S.result[b] ? ' ok' : ' ng';
    const slot = `<button class="${cls}" data-act="slot" data-b="${b}" ${S.answered ? 'disabled' : ''}>${text}</button>`;
    if (S.answered && !S.result[b]) return `<div class="fixwrap ${f}">${slot}<span class="fix">${S.blanks[b].ans}</span></div>`;
    return slot;
}

function formHtml(q) {
  const rows = q.form.rows.map((line, i) =>
    `<div class="fm-row ${line.sum ? 'sum' : ''}"><div class="fm-l">${slotHtml(`fm-${i}-acc`, line.acc, 'acc')}</div><div class="fm-v">${slotHtml(`fm-${i}-amt`, line.amt, 'amt')}</div></div>`).join('');
  return `<div class="jr fm" id="jr"><div class="fm-head">${q.form.caption || '構造を完成させよ'}</div>${rows}</div>`;
}

function cellHtml(q, side, i) {
  const line = q[side][i];
  if (!line) return '<div class="jr-cell"></div>';
  const part = f => {
    const v = line[f];
    if (typeof v !== 'object') return `<div class="fx ${f}">${v}</div>`;
    const b = S.bmap[`${side}-${i}-${f}`];
    const pid = S.fills[b];
    const text = pid === null ? '' : S.parts[pid].text;
    let cls = 'slot ' + f;
    if (pid === null) cls += ' empty'; else cls += ' filled';
    if (!S.answered && b === S.active) cls += ' active';
    if (S.answered) cls += S.result[b] ? ' ok' : ' ng';
    const slot = `<button class="${cls}" data-act="slot" data-b="${b}" ${S.answered ? 'disabled' : ''}>${text}</button>`;
    if (S.answered && !S.result[b]) return `<div class="fixwrap ${f}">${slot}<span class="fix">${S.blanks[b].ans}</span></div>`;
    return slot;
  };
  return `<div class="jr-cell">${part('acc')}${part('amt')}</div>`;
}

function renderQuiz(scrollTop) {
  const q = S.q;
  const total = S.ids.length;
  let body;
  if (q.form) body = formHtml(q);
  else {
    const rows = Math.max(q.dr.length, q.cr.length);
    let jr = '';
    for (let i = 0; i < rows; i++) jr += `<div class="jr-row">${cellHtml(q, 'dr', i)}${cellHtml(q, 'cr', i)}</div>`;
    body = `<div class="jr" id="jr"><div class="jr-head"><span>借方</span><span>貸方</span></div>${jr}</div>`;
  }

  const allFilled = S.fills.every(v => v !== null);
  const used = new Set(S.fills.filter(v => v !== null));
  const isLast = S.idx >= total - 1;
  const partBtn = p => `<button class="part ${isNum(p.text) ? 'num' : ''} ${used.has(p.id) ? 'used' : ''}" data-act="part" data-p="${p.id}" ${used.has(p.id) ? 'disabled' : ''}>${p.text}</button>`;

  let resultHtml = '';
  if (S.answered) {
    const ok = S.result.every(Boolean);
    const wrongN = S.result.filter(r => !r).length;
    resultHtml = `
      <div class="verdict ${ok ? 'ok' : 'ng'}">
        <span style="font-size:24px">${ok ? '◯' : '✕'}</span>
        <div>${ok ? '正解！仕訳の構造は完璧です' : `不正解（${wrongN}か所）`}
          <small>${ok ? (S.mode === 'review' ? '復習リストから削除しました' : 'この調子で次へ') : (S.mode === 'review' ? '復習リストに残ります' : '復習リストに登録しました')}</small>
        </div>
      </div>
      <div class="explain"><h3>解説</h3>${q.explain}</div>`;
  }

  const dock = S.answered
    ? `<div class="dock"><div class="dock-inner">
        <button class="btn btn-pri" data-act="next">${isLast ? '結果を見る' : '次の問題へ'}</button>
      </div></div>`
    : `<div class="dock"><div class="dock-inner">
        <div class="dock-label"><span>パーツをタップ → [ ? ] に入ります</span><span>${S.fills.filter(v => v !== null).length}/${S.fills.length}</span></div>
        <div class="parts">
          <div class="pgrid">${S.parts.filter(p => !isNum(p.text)).map(partBtn).join('')}</div>
          <div class="pgrid n">${S.parts.filter(p => isNum(p.text)).map(partBtn).join('')}</div>
        </div>
        <div class="actions">
          <button class="btn btn-ghost" data-act="clear">リセット</button>
          <button class="btn btn-pri" data-act="judge" ${allFilled ? '' : 'disabled'}>判定する</button>
        </div>
      </div></div>`;

  const prevScroll = scrollTop ? 0 : (document.querySelector('.scroll')?.scrollTop || 0);
  $app.innerHTML = `
    <div class="screen">
      <div class="qbar">
        <button class="back" data-act="menu">${ICON.back}メニュー</button>
        <div class="qbar-title">${S.label}</div>
        <div class="qbar-prog">${S.idx + 1} / ${total}</div>
      </div>
      <div class="progress"><i style="width:${((S.idx + (S.answered ? 1 : 0)) / total) * 100}%"></i></div>
      <div class="scroll"><div class="qwrap">
        <span class="tag ${S.mode === 'review' ? 'rv' : ''}">${S.mode === 'review' ? '要復習・' : ''}${q.cat}</span>
        <h2 class="qtitle">${q.title}</h2>
        <div class="stem">${q.stem}${q.data ? `<div class="data">${q.data}</div>` : ''}</div>
        ${!S.answered && q.hint ? (S.showHint ? `<div class="hint" style="margin-top:8px">💡 ${q.hint}</div>` : `<button class="hint-btn" data-act="hint">💡 ヒントを見る</button>`) : ''}
        ${body}
        ${resultHtml}
      </div></div>
      ${dock}
    </div>`;
  const sc = document.querySelector('.scroll');
  if (sc) sc.scrollTop = prevScroll;
  if (!S.answered && !scrollTop) {
    const a = document.querySelector('.slot.active');
    a && a.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

/* 判定：同じ側（借方・貸方）の中で行の順番が入れ替わっていても正解とする */
function gradeBlanks() {
  const q = S.q;
  const res = S.blanks.map((b, i) => S.parts[S.fills[i]].text === b.ans);
  if (q.form) return res;
  for (const side of ['dr', 'cr']) {
    const user = [], ans = [], idx = [];
    q[side].forEach((line, i) => {
      const u = [], a = [];
      for (const f of ['acc', 'amt']) {
        const v = line[f];
        if (typeof v === 'object') { const b = S.bmap[`${side}-${i}-${f}`]; idx.push(b); u.push(S.parts[S.fills[b]].text); a.push(v.b); }
        else { u.push(v); a.push(v); }
      }
      user.push(u.join('|')); ans.push(a.join('|'));
    });
    if (user.slice().sort().join('#') === ans.slice().sort().join('#')) idx.forEach(b => { res[b] = true; });
  }
  return res;
}

function judge() {
  S.result = gradeBlanks();
  S.answered = true;
  const ok = S.result.every(Boolean);
  const id = S.q.id;
  let review = getReview();
  if (ok) {
    S.score++;
    const solved = getSolved(); solved[id] = true; store.set(KEY_SOLVED, solved);
    if (S.mode === 'review') review = review.filter(x => x !== id);
  } else {
    if (!review.includes(id)) review.push(id);
  }
  setReview(review);

  // 演出
  const st = document.createElement('div');
  st.className = 'stamp ' + (ok ? 'ok' : 'ng');
  st.innerHTML = `<div>${ok ? '◯' : '✕'}</div>`;
  document.body.appendChild(st);
  setTimeout(() => st.remove(), 950);
  buzz(ok ? 40 : [60, 60, 60]);

  renderQuiz(false);
  if (!ok) document.getElementById('jr')?.classList.add('shake');
  // 結果エリアへ軽くスクロール
  setTimeout(() => {
    const v = document.querySelector('.verdict');
    v && v.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 400);
}

function renderDone() {
  const total = S.ids.length;
  const remain = getReview().length;
  $app.innerHTML = `
    <header class="topbar"><h1>簿記1級仕分けパズル</h1><p>${S.label}</p></header>
    <main class="wrap"><div class="done">
      <p>おつかれさまでした</p>
      <div class="big">${S.score} / ${total}</div>
      <p>${S.mode === 'review' ? `復習リスト残り：${remain}問` : (S.score === total ? '全問正解！' : '間違えた問題は「要復習モード」に登録されました')}</p>
      ${remain && S.mode === 'review' ? `<button class="btn btn-ng" data-act="review">もう一度復習する</button>` : ''}
      <button class="btn btn-pri" data-act="menu">メニューに戻る</button>
    </div></main>`;
}

function showModal(title, body) {
  const m = document.createElement('div');
  m.className = 'modal-bg';
  m.innerHTML = `<div class="modal"><div class="ic">${ICON.clock}</div><h3>${title}</h3><p>${body}</p>
    <button class="btn btn-pri" data-act="close-modal">OK</button></div>`;
  m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-act="close-modal"]')) m.remove(); });
  document.body.appendChild(m);
}

/* ---------- イベント（委譲） ---------- */
$app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act;

  if (act === 'cat') {
    const c = el.dataset.cat;
    const ids = QUESTIONS.filter(q => q.cat === c).map(q => q.id);
    if (!ids.length) { showModal('問題準備中', `「${c}」の問題は現在準備中です。<br>順次追加予定です。`); return; }
    startSession('cat', ids, c);
  }
  else if (act === 'mode') { menuMode = el.dataset.mode; renderMenu(); }
  else if (act === 'random') { startSession('cat', shuffle(QUESTIONS.map(q => q.id)), '全範囲からランダム'); }
  else if (act === 'review-cat') {
    const ids = getReview().filter(id => qById(id).cat === el.dataset.cat);
    if (ids.length) startSession('review', ids, '要復習：' + el.dataset.cat);
  }
  else if (act === 'review') {
    const ids = getReview();
    if (ids.length) startSession('review', shuffle(ids), '要復習モード');
  }
  else if (act === 'menu') { renderMenu(); window.scrollTo(0, 0); }
  else if (act === 'part') {
    if (S.answered) return;
    let t = S.fills[S.active] === null ? S.active : nextEmpty(S.active);
    if (t < 0) return;
    S.fills[t] = +el.dataset.p;
    const n = nextEmpty(t);
    S.active = n < 0 ? t : n;
    buzz(8);
    renderQuiz(false);
  }
  else if (act === 'slot') {
    if (S.answered) return;
    const b = +el.dataset.b;
    if (S.fills[b] !== null) S.fills[b] = null; // タップで取り外し
    S.active = b;
    renderQuiz(false);
  }
  else if (act === 'clear') { S.fills = S.fills.map(() => null); S.active = 0; renderQuiz(false); }
  else if (act === 'hint') { S.showHint = true; renderQuiz(false); }
  else if (act === 'judge') { if (S.fills.every(v => v !== null)) judge(); }
  else if (act === 'next') {
    if (S.idx < S.ids.length - 1) { S.idx++; loadQuestion(); } else renderDone();
  }
});

// ダブルタップ拡大の抑止（揺れる車内での誤操作対策）
let lastTouch = 0;
document.addEventListener('touchend', e => { const now = Date.now(); if (now - lastTouch < 300) e.preventDefault(); lastTouch = now; }, { passive: false });

renderMenu();

/* オフライン対応：Webサーバー（GitHub Pages等）で公開したときだけService Workerを登録 */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
